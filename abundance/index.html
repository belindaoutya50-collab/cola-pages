<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>丰盈体检</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f4f0;--card:#fff;--text:#2c2c2c;--text2:#5c5c5c;--text3:#999;
  --accent:#5b7b5e;--accent2:#b8956a;--accent3:#8b6f47;
  --border:#e8e4dd;--shadow:0 1px 3px rgba(0,0,0,.03),0 4px 12px rgba(0,0,0,.02);
  --radius:14px;--r-sm:10px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;
  min-height:100dvh;-webkit-font-smoothing:antialiased;
}
.container{max-width:460px;margin:0 auto;padding:24px 16px 40px;}

/* Landing */
.landing{text-align:center;padding:60px 16px 40px;}
.landing .icon{font-size:48px;margin-bottom:24px;}
.landing h1{font-size:22px;font-weight:600;color:var(--accent);margin-bottom:12px;letter-spacing:.5px;}
.landing .desc{font-size:15px;color:var(--text2);margin-bottom:8px;line-height:1.7;}
.landing .meta{font-size:13px;color:var(--text3);margin-bottom:36px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:14px 32px;border-radius:10px;font-size:16px;font-weight:500;
  border:none;cursor:pointer;transition:all .2s;font-family:inherit;
}
.btn-primary{background:var(--accent);color:#fff;width:100%;}
.btn-primary:active{background:#4a6a4d;}
.btn-outline{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}

/* Progress */
.progress-wrap{padding:16px 0;}
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);transition:width .3s;border-radius:2px;}
.progress-text{text-align:center;font-size:12px;color:var(--text3);margin-top:8px;}

/* Section transition */
.section-break{text-align:center;padding:60px 16px;}
.section-break .section-label{font-size:13px;color:var(--accent2);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;}
.section-break h2{font-size:20px;color:var(--text);font-weight:500;margin-bottom:24px;}

/* Question */
.card{background:var(--card);border-radius:var(--radius);padding:28px 20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border);}
.q-num{font-size:12px;color:var(--accent2);margin-bottom:12px;font-weight:500;letter-spacing:1px;}
.q-text{font-size:17px;line-height:1.6;color:var(--text);margin-bottom:20px;font-weight:400;}
.option{
  display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:8px;
  border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--bg);
  font-size:15px;color:var(--text);cursor:pointer;transition:all .15s;
  font-family:inherit;line-height:1.5;
}
.option:active,.option.selected{background:var(--accent);color:#fff;border-color:var(--accent);}
.option-label{font-weight:500;margin-right:6px;}

/* Generating */
.generating{text-align:center;padding:80px 16px;}
.generating .gen-icon{font-size:48px;margin-bottom:20px;animation:pulse 1.5s infinite;}
.generating .gen-text{font-size:16px;color:var(--text2);}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}

/* Results */
.result-header{text-align:center;padding:32px 0 8px;}
.result-header .index-num{font-size:72px;font-weight:700;color:var(--accent);line-height:1;letter-spacing:-2px;}
.result-header .index-label{font-size:15px;color:var(--text2);margin-top:4px;}
.result-header .index-desc{font-size:14px;color:var(--text2);margin-top:12px;line-height:1.7;max-width:360px;margin-left:auto;margin-right:auto;}

.radar-wrap{text-align:center;padding:20px 0;}
.radar-wrap canvas{max-width:320px;width:100%;}

.section-title{font-size:15px;font-weight:600;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.section-title .s-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}

.result-text{font-size:14px;color:var(--text2);line-height:1.8;}

.blindspot-box{background:#fdf8f2;border-left:3px solid var(--accent2);padding:16px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin:12px 0;}
.blindspot-box .bs-label{font-size:12px;color:var(--accent2);font-weight:500;margin-bottom:6px;}
.blindspot-box .bs-text{font-size:14px;color:var(--text);line-height:1.7;}

.owned-list{list-style:none;}
.owned-list li{padding:10px 0 10px 24px;position:relative;font-size:14px;color:var(--text2);line-height:1.6;}
.owned-list li::before{content:'📍';position:absolute;left:0;top:10px;}

.share-area{text-align:center;padding:24px 0;}
#shareCard{background:var(--card);border-radius:var(--radius);padding:32px 24px;box-shadow:0 2px 16px rgba(0,0,0,.06);border:1px solid var(--border);text-align:center;margin-bottom:16px;}
#shareCard .sc-index{font-size:64px;font-weight:700;color:var(--accent);line-height:1;}
#shareCard .sc-label{font-size:14px;color:var(--text2);margin:4px 0 12px;}
#shareCard .sc-top{font-size:14px;color:var(--accent2);margin-bottom:6px;font-weight:500;}
#shareCard .sc-blind{font-size:13px;color:var(--text2);margin-bottom:12px;}
#shareCard .sc-footer{font-size:11px;color:var(--text3);margin-top:16px;padding-top:12px;border-top:1px solid var(--border);}

.fade-in{animation:fadeIn .5s ease-out;}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.hidden{display:none!important}
.text-center{text-align:center}
.mt-12{margin-top:12px}
.mt-16{margin-top:16px}
.mt-24{margin-top:24px}
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
// ── Questions ──────────────────────────────────────────
const questions = [
  // Dimension 1: 物质与能力
  {id:1,q:"过去一年，你学会了一项以前不会的东西。它属于？",dim:1,type:"objective",options:[
    {t:"技术或工具类",s:3},{t:"表达或创作类",s:3},{t:"生活或实践类",s:2},{t:"人际或管理类",s:2},{t:"还没有学会什么新东西",s:0}
  ]},
  {id:2,q:"你现在用的最贵的那样东西（除了房子和车），是你什么时候得到的？",dim:1,type:"objective",options:[
    {t:"最近半年内",s:1},{t:"半年到一年前",s:2},{t:"一到三年前",s:3},{t:"三年以上",s:3},{t:"没有称得上贵的东西",s:0}
  ]},
  {id:3,q:"你上次因为懂得比别人多而帮到一个人，是在什么场景？",dim:1,type:"objective",options:[
    {t:"工作专业领域",s:3},{t:"生活经验或常识",s:2},{t:"技术工具或数码产品",s:2},{t:"人际关系或情感",s:2},{t:"不记得帮过",s:0}
  ]},
  {id:4,q:"如果明天你的主要收入来源断了，你多久能找到新方向？",dim:1,type:"subjective",options:[
    {t:"已经有几个明确方向",s:3},{t:"大概一个月内能搞定",s:2},{t:"可能需要几个月",s:1},{t:"完全没头绪",s:0}
  ]},
  {id:5,q:"如果有人认真夸你的某项能力，你的第一反应是？",dim:1,type:"subjective",options:[
    {t:"真心认同，确实做得不错",s:3},{t:"有点不好意思，但想想也对",s:2},{t:"觉得对方是在客气",s:1},{t:"觉得对方看走眼了",s:0}
  ]},
  {id:6,q:"你觉得你的技能组合，放在你认识的人里大概排多少？",dim:1,type:"subjective",options:[
    {t:"比大多数人有优势",s:3},{t:"中等偏上",s:2},{t:"差不多平均水平",s:1},{t:"不太有优势",s:0}
  ]},
  // Dimension 2: 关系与连接
  {id:7,q:"你手机里能半夜打电话求助的人有几个？",dim:2,type:"objective",options:[
    {t:"5 个以上",s:3},{t:"3–5 个",s:2},{t:"1–2 个",s:1},{t:"没有",s:0}
  ]},
  {id:8,q:"最近一个月内，主动联系你、问你近况的人（不算工作关系）有几个？",dim:2,type:"objective",options:[
    {t:"5 个以上",s:3},{t:"3–5 个",s:2},{t:"1–2 个",s:1},{t:"没有",s:0}
  ]},
  {id:9,q:"最近一次有人认真感谢你，是因为什么？",dim:2,type:"objective",options:[
    {t:"帮了对方一个具体的忙",s:2},{t:"长期的陪伴或支持",s:3},{t:"给了对方重要的建议或启发",s:3},{t:"记不太清了",s:0}
  ]},
  {id:10,q:"你觉得自己是一个"有人可以依靠"的人吗？",dim:2,type:"subjective",options:[
    {t:"非常确定，不止一个人",s:3},{t:"大多数时候是",s:2},{t:"不太确定",s:1},{t:"不是",s:0}
  ]},
  {id:11,q:"你认识的人里，有没有谁的生活是你曾经羡慕过、但现在回头看发现自己其实也差不多拥有了的？",dim:2,type:"subjective",options:[
    {t:"有，而且不止一个",s:3},{t:"有一个",s:2},{t:"可能有但没仔细想过",s:1},{t:"没有",s:0}
  ]},
  {id:12,q:"遇到困难或纠结时，你通常会找人聊吗？",dim:2,type:"subjective",options:[
    {t:"有固定的人可以聊，随时找得到",s:3},{t:"会找，看情况选不同的人",s:2},{t:"偶尔找，不太习惯",s:1},{t:"基本不找人聊",s:0}
  ]},
  // Dimension 3: 经历与验证
  {id:13,q:"一年前你最焦虑的那件事，现在回头看，实际发生了什么？",dim:3,type:"objective",options:[
    {t:"完全没发生，白焦虑了",s:3},{t:"发生了，但远没有想的那么糟",s:3},{t:"发生了，但扛过来了",s:2},{t:"确实发生了且影响很大",s:0}
  ]},
  {id:14,q:"你有没有一件"当初觉得绝对做不到、后来居然做到了"的事？",dim:3,type:"objective",options:[
    {t:"不止一件，能说出两三件",s:3},{t:"有一件很明确的",s:2},{t:"可能有但不太确定",s:1},{t:"没有",s:0}
  ]},
  {id:15,q:"最近一次意外的正面结果（你没期待、但事情比预期好），发生在什么时候？",dim:3,type:"objective",options:[
    {t:"一周内",s:3},{t:"一个月内",s:2},{t:"三个月内",s:1},{t:"记不清了",s:0}
  ]},
  {id:16,q:"你觉得过去一年，自己是变好了还是变差了？",dim:3,type:"subjective",options:[
    {t:"明显变好了",s:3},{t:"有些方面变好了",s:2},{t:"有好有坏，差不多",s:1},{t:"变差了",s:0}
  ]},
  {id:17,q:"你觉得"我是个运气好的人"这句话，有几分符合你？",dim:3,type:"subjective",options:[
    {t:"很符合，经历验证过",s:3},{t:"有点符合，某些方面确实运气好",s:2},{t:"不太符合，运气一般",s:1},{t:"不符合，运气不太好",s:0}
  ]},
  {id:18,q:"你觉得一年后的你回头看现在的你，会觉得现在担心的事里有多少是白担心的？",dim:3,type:"subjective",options:[
    {t:"大部分都不值得担心",s:3},{t:"一半一半吧",s:2},{t:"大部分确实值得担心",s:1},{t:"全都是值得担心的",s:0}
  ]}
];

// ── State ──────────────────────────────────────────────
let answers = [];
let currentQ = 0;
let currentScreen = 'landing';

// ── Scoring ───────────────────────────────────────────
function calcScores() {
  const dims = {1:{obj:{total:0,max:0},sub:{total:0,max:0}},
                2:{obj:{total:0,max:0},sub:{total:0,max:0}},
                3:{obj:{total:0,max:0},sub:{total:0,max:0}}};
  answers.forEach(a => {
    const q = questions[a.qIdx];
    const d = dims[q.dim];
    const key = q.type === 'objective' ? 'obj' : 'sub';
    d[key].total += a.score;
    d[key].max += 3;
  });
  const result = {dimensions:{},totalObj:0,totalSub:0,totalMaxObj:0,totalMaxSub:0};
  [1,2,3].forEach(d => {
    const obj = dims[d].obj.max > 0 ? Math.round(dims[d].obj.total / dims[d].obj.max * 100) : 0;
    const sub = dims[d].sub.max > 0 ? Math.round(dims[d].sub.total / dims[d].sub.max * 100) : 0;
    let type;
    if (obj >= 60 && sub >= 60) type = 'confirmed';
    else if (obj >= 60 && sub < 60) type = 'blindspot';
    else if (obj < 60 && sub >= 60) type = 'resilience';
    else type = 'developing';
    result.dimensions[d] = {obj,sub,type};
    result.totalObj += obj; result.totalSub += sub;
    result.totalMaxObj += 100; result.totalMaxSub += 100;
  });
  result.index = Math.round((result.totalObj + result.totalSub) / 6);
  return result;
}

function getIndexDesc(score) {
  if (score >= 80) return "你的丰盈程度很高。你不仅拥有很多，而且你清楚地意识到了这些。保持这种觉察，它是你面对不确定性的底气。";
  if (score >= 65) return "你拥有的比你以为的多。尤其是在某些维度上，你可能低估了自己已经积累的资源。再仔细看看下面的分析。";
  if (score >= 50) return "你的生活里有不少好东西，但你可能习惯了不把它们当回事。试试重新审视一下——有些东西你早已拥有。";
  return "丰盈不是指你拥有多少，而是你是否看见。你的生活里有值得注意的资源，可能只是还没被照亮。慢慢来。";
}

function getDimName(d) { return d===1?'物质与能力':d===2?'关系与连接':'经历与验证'; }

function getConfirmedText(dimNum) {
  const map = {
    1: "你的能力和物质基础是你最稳固的丰盈来源。你学会过新东西、拥有让你安心的物品、你的专业能力被验证过。这些不是运气——是你日积月累的结果。",
    2: "你身边的人是你最宝贵的资产。有人主动联系你、感谢过你、可以在深夜接你电话。这些连接不是理所当然的——是你经营和吸引来的。",
    3: "你经历过的事给了你最大的底气。那些曾经让你焦虑的事大多没有按最坏的剧本发生，你做到过"以为做不到"的事。这些经历已经内化成了你的韧性。"
  };
  return map[dimNum] || '';
}

function getBlindspotText(dimNum) {
  const map = {
    1: "你可能低估了自己的能力和资源。客观数据显示你拥有不少——但你对自己的评分偏低。有没有可能你已经把一个"正常水平"当成了"不够好"？试着换个参照系看看。",
    2: "你的数据显示你不是一个人——有不止一个人会主动找你、感谢过你、可以依靠。但你对自己"有人可以依靠"的感知偏低。明明有，却不太当回事。你有没有在把"不想麻烦别人"和"没有人可以依靠"搞混？",
    3: "你经历过的考验比你以为的多，但你可能没有把它们"归档"为你的能力。那些挺过来的时刻、那些没发生的灾难、那些意外的好结果——它们都是你的验证数据。别轻易忽略。"
  };
  return map[dimNum] || '';
}

function getOwnedItems(answers, dims) {
  const items = [];
  // Check for specific high-score patterns
  const byId = {};
  answers.forEach(a => { byId[a.qIdx] = a; });
  
  if (byId[0] && byId[0].score >= 2) items.push("你有一项过去一年新获得的能力");
  if (byId[1] && byId[1].score >= 2) items.push("你拥有一件陪伴了你不止半年的珍贵物品");
  if (byId[2] && byId[2].score >= 2) items.push("你的专业知识曾经真实地帮助过别人");
  if (byId[6] && byId[6].score >= 2) items.push("你手机里有不止一个可以在深夜求助的人");
  if (byId[7] && byId[7].score >= 2) items.push("最近有人主动关心过你的近况");
  if (byId[8] && byId[8].score >= 2) items.push("有人认真感谢过你——因为陪伴、支持或启发");
  if (byId[12] && byId[12].score >= 2) items.push("一年前让你焦虑的事，实际结果远没有那么糟");
  if (byId[13] && byId[13].score >= 1) items.push("你做到过一件"曾经以为做不到"的事");
  if (byId[14] && byId[14].score >= 2) items.push("最近一个月内遇到过意外的正面结果");
  if (byId[15] && byId[15].score >= 2) items.push("你觉得自己过去一年在变好");
  
  // Ensure at least 3 items
  if (items.length < 3) {
    const fallbacks = [
      "你完成了一次认真的自我盘点——这本身就不容易",
      "你有能力停下来审视自己的生活",
      "你在这里花了15分钟关注自己"
    ];
    while (items.length < 3) items.push(fallbacks[items.length % 3]);
  }
  return items.slice(0, 5);
}

// ── Radar Chart ────────────────────────────────────────
function drawRadar(canvas, dims) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width = 320;
  const h = canvas.height = 320;
  const cx = w/2, cy = h/2, r = 120;
  const labels = ['物质与能力','关系与连接','经历与验证'];
  const angles = [-Math.PI/2, Math.PI/6, 5*Math.PI/6]; // top, bottom-right, bottom-left

  ctx.clearRect(0,0,w,h);

  // Grid
  for (let i = 1; i <= 5; i++) {
    ctx.beginPath();
    const rr = r * i / 5;
    for (let j = 0; j < 3; j++) {
      const a = angles[j];
      const x = cx + rr * Math.cos(a);
      const y = cy + rr * Math.sin(a);
      j === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = '#e8e4dd';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Axes
  angles.forEach(a => {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
    ctx.strokeStyle = '#e8e4dd';
    ctx.stroke();
  });

  // Labels
  ctx.fillStyle = '#5c5c5c';
  ctx.font = '13px -apple-system, "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  angles.forEach((a, i) => {
    const lr = r + 30;
    const x = cx + lr * Math.cos(a);
    const y = cy + lr * Math.sin(a);
    ctx.fillText(labels[i], x, y + 5);
  });

  // Data polygons
  const drawPolygon = (values, color, dashed, alpha) => {
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const val = Math.max(5, values[i]) / 100;
      const rr = r * val;
      const x = cx + rr * Math.cos(angles[i]);
      const y = cy + rr * Math.sin(angles[i]);
      i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    if (dashed) ctx.setLineDash([4,4]); else ctx.setLineDash([]);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.fillStyle = color.replace(')', `,${alpha})`).replace('rgb','rgba');
    if (color.startsWith('#')) {
      const hex = color;
      const rr = parseInt(hex.slice(1,3),16);
      const gg = parseInt(hex.slice(3,5),16);
      const bb = parseInt(hex.slice(5,7),16);
      ctx.fillStyle = `rgba(${rr},${gg},${bb},${alpha})`;
    }
    ctx.fill();
    ctx.setLineDash([]);
  };

  const objVals = [dims[1].obj, dims[2].obj, dims[3].obj];
  const subVals = [dims[1].sub, dims[2].sub, dims[3].sub];

  drawPolygon(subVals, '#b8956a', true, 0.1);
  drawPolygon(objVals, '#5b7b5e', false, 0.15);

  // Legend
  ctx.font = '11px -apple-system, "PingFang SC", sans-serif';
  const lx = 20, ly = h - 30;
  ctx.fillStyle = '#5b7b5e';
  ctx.fillRect(lx, ly-8, 18, 3);
  ctx.fillStyle = '#5c5c5c';
  ctx.textAlign = 'left';
  ctx.fillText('客观分', lx+24, ly-2);

  ctx.setLineDash([3,3]);
  ctx.beginPath();
  ctx.moveTo(lx+100, ly-6);
  ctx.lineTo(lx+118, ly-6);
  ctx.strokeStyle = '#b8956a';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillText('主观分', lx+124, ly-2);
}

// ── Rendering ──────────────────────────────────────────
const app = document.getElementById('app');

function renderLanding() {
  currentScreen = 'landing';
  app.innerHTML = `
    <div class="landing fade-in">
      <div class="icon">🔍</div>
      <h1>丰盈体检</h1>
      <div class="desc">这不是心理测试。</div>
      <div class="desc">15 分钟，看清你已经拥有但忘了的东西。</div>
      <div class="meta">18 道选择题 · 不收集数据 · 用完即走</div>
      <button class="btn btn-primary" onclick="startQuiz()">开始</button>
    </div>`;
}

function startQuiz() {
  answers = [];
  currentQ = 0;
  renderQuestion();
}

function renderQuestion() {
  currentScreen = 'question';
  const q = questions[currentQ];
  const section = Math.floor(currentQ / 6) + 1;
  const qInSection = (currentQ % 6) + 1;
  const dimNames = ['','物质与能力','关系与连接','经历与验证'];

  // Section break before Q1, Q7, Q13
  if (currentQ === 0 || currentQ === 6 || currentQ === 12) {
    const dimNum = Math.floor(currentQ / 6) + 1;
    app.innerHTML = `
      <div class="section-break fade-in">
        <div class="section-label">第 ${dimNum} 部分</div>
        <h2>${dimNames[dimNum]}</h2>
        <button class="btn btn-primary" onclick="continueSection()" style="width:auto;padding:12px 36px;font-size:15px;">继续</button>
      </div>`;
    return;
  }

  const progress = Math.round(currentQ / 18 * 100);

  app.innerHTML = `
    <div class="progress-wrap fade-in">
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="progress-text">第 ${currentQ + 1} / 18 题</div>
    </div>
    <div class="card fade-in">
      <div class="q-num">Q${q.id} · ${dimNames[q.dim]}</div>
      <div class="q-text">${q.q}</div>
      ${q.options.map((o,i) => `
        <button class="option" onclick="selectAnswer(${currentQ},${i})">
          <span class="option-label">${'ABCDE'[i]}.</span>${o.t}
        </button>
      `).join('')}
    </div>`;
}

function continueSection() {
  renderQuestion();
}

function selectAnswer(qIdx, optIdx) {
  const q = questions[qIdx];
  const score = q.options[optIdx].s;
  answers.push({qIdx, score});
  currentQ++;

  // Highlight selected
  const opts = document.querySelectorAll('.option');
  opts.forEach(o => o.classList.remove('selected'));
  if (opts[optIdx]) opts[optIdx].classList.add('selected');

  if (currentQ >= 18) {
    setTimeout(renderGenerating, 300);
  } else {
    setTimeout(renderQuestion, 400);
  }
}

function renderGenerating() {
  currentScreen = 'generating';
  app.innerHTML = `
    <div class="generating fade-in">
      <div class="gen-icon">✨</div>
      <div class="gen-text">正在整理你的丰盈地图…</div>
    </div>`;
  setTimeout(renderResults, 2500);
}

function renderResults() {
  currentScreen = 'results';
  const result = calcScores();
  const dims = result.dimensions;

  // Find best and blindspot dimensions
  let bestDim = 1, bestScore = 0;
  let blindDim = null;
  [1,2,3].forEach(d => {
    const avg = (dims[d].obj + dims[d].sub) / 2;
    if (avg > bestScore) { bestScore = avg; bestDim = d; }
    if (dims[d].type === 'blindspot' && !blindDim) blindDim = d;
  });

  const ownedItems = getOwnedItems(answers, dims);

  let html = `
    <div class="result-header fade-in">
      <div class="index-num">${result.index}</div>
      <div class="index-label">你的丰盈指数</div>
      <div class="index-desc">${getIndexDesc(result.index)}</div>
    </div>

    <div class="radar-wrap fade-in">
      <canvas id="radarCanvas"></canvas>
      <div style="font-size:11px;color:var(--text3);margin-top:4px;">实线 = 客观分 · 虚线 = 主观分</div>
    </div>`;

  // Confirmed strength
  html += `
    <div class="card fade-in" style="margin-top:16px">
      <div class="section-title"><span class="s-dot"></span>你最稳固的丰盈来源：${getDimName(bestDim)}</div>
      <div class="result-text">${getConfirmedText(bestDim)}</div>
    </div>`;

  // Blind spot
  if (blindDim) {
    html += `
    <div class="card fade-in">
      <div class="section-title"><span class="s-dot" style="background:var(--accent2)"></span>你可能低估了：${getDimName(blindDim)}</div>
      <div class="blindspot-box">
        <div class="bs-label">🪞 盲区发现</div>
        <div class="bs-text">${getBlindspotText(blindDim)}</div>
      </div>
      <div class="result-text mt-12">
        客观分 <strong style="color:var(--accent)">${dims[blindDim].obj}</strong> · 主观分 <strong style="color:var(--accent2)">${dims[blindDim].sub}</strong>
        <span style="font-size:12px;color:var(--text3);margin-left:4px;">（差距 ${dims[blindDim].obj - dims[blindDim].sub} 分）</span>
      </div>
    </div>`;
  }

  // Owned items
  html += `
    <div class="card fade-in">
      <div class="section-title"><span class="s-dot"></span>你已经拥有的</div>
      <ul class="owned-list">${ownedItems.map(item => `<li>${item}</li>`).join('')}</ul>
    </div>`;

  // Share card
  html += `
    <div class="share-area fade-in">
      <div id="shareCard">
        <div style="font-size:13px;color:var(--accent2);margin-bottom:4px;">丰盈体检</div>
        <div class="sc-index">${result.index}</div>
        <div class="sc-label">丰盈指数</div>
        <div class="sc-top">✦ 最强维度：${getDimName(bestDim)}</div>
        ${blindDim ? `<div class="sc-blind">🪞 盲区：${getDimName(blindDim)} — 你有但你没意识到</div>` : ''}
        <div class="sc-footer">测测你的丰盈指数</div>
      </div>
      <button class="btn btn-outline" onclick="shareResult()" style="width:auto;padding:10px 24px;font-size:14px;">📋 复制分享文案</button>
      <button class="btn btn-outline" onclick="restartQuiz()" style="width:auto;padding:10px 24px;font-size:14px;margin-top:8px;">🔄 重新测试</button>
    </div>`;

  app.innerHTML = html;

  // Draw radar
  setTimeout(() => {
    const canvas = document.getElementById('radarCanvas');
    if (canvas) drawRadar(canvas, dims);
  }, 100);
}

function shareResult() {
  const result = calcScores();
  const dims = result.dimensions;
  let bestDim = 1, bestScore = 0, blindDim = null;
  [1,2,3].forEach(d => {
    const avg = (dims[d].obj + dims[d].sub) / 2;
    if (avg > bestScore) { bestScore = avg; bestDim = d; }
    if (dims[d].type === 'blindspot' && !blindDim) blindDim = d;
  });

  let text = `🔍 我的丰盈指数：${result.index}\n\n`;
  text += `✨ 最强维度：${getDimName(bestDim)}\n`;
  if (blindDim) text += `🪞 盲区发现：${getDimName(blindDim)} — 我可能低估了这一块\n`;
  text += `\n测测你的 → ${window.location.href}`;

  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.btn-outline');
    if (btn) { btn.textContent = '✅ 已复制'; setTimeout(() => { btn.textContent = '📋 复制分享文案'; }, 2000); }
  }).catch(() => alert('复制失败，请手动复制'));
}

function restartQuiz() {
  answers = [];
  currentQ = 0;
  renderLanding();
  window.scrollTo(0, 0);
}

// ── Init ───────────────────────────────────────────────
renderLanding();
</script>
</body>
</html>
