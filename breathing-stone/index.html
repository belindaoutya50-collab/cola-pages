<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6e5d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>呼吸石 · 一座会呼吸的小庭院</title>
<meta name="description" content="跟着石头呼吸六圈的正念小游戏。按住吸气，松手呼气。无需下载，手机浏览器直接打开。">
<style>
/* ============ 变量 ============ */
:root{
  --paper:#e6e5d8; --paper-2:#edece0; --cream:#f7f6ee;
  --ink:#28352a; --ink-2:#4f5d4f; --ink-3:#87917f;
  --line:rgba(40,53,42,.16); --line-2:rgba(40,53,42,.08);
  --seal:#a3452f; --seal-2:#87382a; --water:#728781;
  --card:rgba(244,243,232,.62);
  --veil:linear-gradient(180deg,rgba(230,229,216,.82),rgba(233,232,219,.94) 38%,rgba(233,232,219,.97));
  --shadow:rgba(30,44,38,.1);
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",STSong,"SimSun",serif;
  --tap:2.9rem;
}
html{font-size:16px}
html.elder{font-size:19.5px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:1rem;line-height:1.5;overflow:hidden;
  touch-action:manipulation;
}
::selection{background:rgba(163,69,47,.16)}
button{font-family:inherit;color:inherit}
img{max-width:100%}

/* ============ 背景 ============ */
.app{position:relative;height:100%;isolation:isolate}

/* 夜色：全局反转文字变量 */
html[data-dark="1"]{
  --paper:#121813; --paper-2:#182019; --cream:#1c241d;
  --ink:#e6ead9; --ink-2:#b3bfae; --ink-3:#7f8d7c;
  --line:rgba(230,234,217,.16); --line-2:rgba(230,234,217,.08);
  --seal:#cd8259; --seal-2:#b56a47;
  --card:rgba(13,18,14,.55);
  --veil:linear-gradient(180deg,rgba(12,17,13,.84),rgba(13,18,14,.95) 40%,rgba(13,18,14,.97));
  --shadow:rgba(0,0,0,.5);
}
html[data-dark="1"] .tool:hover{background:rgba(255,255,255,.07)}
html[data-dark="1"] .chip[aria-pressed="true"]{background:rgba(255,255,255,.05)}
html[data-dark="1"] .light-btn[aria-pressed="true"],
html[data-dark="1"] .mood-btn[aria-pressed="true"]{background:rgba(255,255,255,.07)}
html[data-dark="1"] .switch{background:rgba(255,255,255,.06)}
html[data-dark="1"] .switch[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
html[data-dark="1"] .coach{background:rgba(15,20,16,.96)}
html[data-dark="1"] .x:hover{background:rgba(255,255,255,.07)}

/* ============ 顶栏 ============ */
.top{
  position:relative;z-index:6;
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  max-width:1180px;margin:0 auto;padding:.85rem 1.1rem .3rem;
}
.brand{display:flex;align-items:center;gap:.55rem;min-width:0}
.brand-mark{
  flex:none;width:2rem;height:2rem;border:1px solid var(--line);border-radius:.35rem;
  display:grid;place-items:center;font-family:var(--serif);font-size:.95rem;
}
.brand b{font:400 1.02rem/1.2 var(--serif);letter-spacing:.14em;display:block}
.brand small{display:block;font-size:.62rem;letter-spacing:.2em;color:var(--ink-3);margin-top:.18rem}
.tools{display:flex;gap:.15rem;flex:none}
.tool{
  min-width:var(--tap);min-height:var(--tap);border:1px solid transparent;border-radius:.4rem;
  background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;
  font-size:.74rem;letter-spacing:.1em;cursor:pointer;color:var(--ink-2);transition:background .2s,color .2s;
}
.tool:hover{background:rgba(255,255,255,.55);color:var(--ink)}
.tool .ic{width:1.05rem;height:1.05rem;flex:none}
.tool.on{color:var(--seal)}
.tool-label{display:inline}

/* ============ 主体：画面铺满整屏，文字分上下两带 ============ */
.kicker{font-size:.64rem;letter-spacing:.24em;color:var(--ink-3);margin:0 0 .55rem}
.h1{font:400 clamp(1.16rem,2.9vw,1.5rem)/1.7 var(--serif);letter-spacing:.14em;margin:0 0 .4rem}
.h1 b{font-weight:400;color:var(--seal)}
.lede{font-size:.85rem;color:var(--ink-2);margin:0 auto .9rem;max-width:25rem;line-height:2;letter-spacing:.02em}

/* 节奏：不加框，只靠下划线区分 */
.chips{display:flex;gap:.2rem;justify-content:center;flex-wrap:wrap;margin:0}
.chip{
  border:0;border-bottom:1px solid transparent;background:transparent;border-radius:0;
  padding:.4rem .95rem .5rem;font-size:.78rem;cursor:pointer;line-height:1.45;color:var(--ink-3);letter-spacing:.08em;
}
.chip span{display:block;font-size:.6rem;color:var(--ink-3);letter-spacing:.1em;margin-top:.1rem}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.chip[aria-pressed="true"] span{color:var(--ink-2)}

/* ============ 画布（全屏背景） ============ */
.scene{position:fixed;inset:0;z-index:0}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hit{
  position:absolute;left:47%;top:60%;transform:translate(-50%,-50%);
  width:66%;max-width:34rem;aspect-ratio:1.32/1;border:0;background:transparent;padding:0;cursor:pointer;z-index:3;
  border-radius:50%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.center{
  position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 3.5rem);transform:translateX(-50%);z-index:4;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:.1rem;
  padding:.5rem 1.15rem .6rem;border-radius:.45rem;background:var(--card);
}
.count{font-size:.6rem;letter-spacing:.26em;color:var(--ink-2)}
.verb{
  font:400 clamp(.98rem,3.8vw,1.2rem)/1.4 var(--serif);letter-spacing:.28em;text-indent:.28em;white-space:nowrap;
}
.verb small{display:block;font-size:.56rem;letter-spacing:.22em;text-indent:.22em;color:var(--ink-3);margin-top:.26rem;font-family:var(--sans)}
.hand{margin-top:.1rem;opacity:.85;animation:handIn .5s ease both}
.hand svg{width:1.15rem;height:1.15rem;stroke:var(--ink)}
.hand.hide{display:none}
@keyframes handIn{from{opacity:0;transform:translateY(-.3rem)}to{opacity:.9;transform:none}}
.hint{
  position:absolute;left:50%;bottom:10.2rem;transform:translateX(-50%);z-index:4;pointer-events:none;
  font-size:.7rem;color:var(--ink-2);letter-spacing:.1em;max-width:92%;text-align:center;
  padding:.28rem .7rem;border-radius:1rem;background:var(--card);
  transition:opacity .6s
}
.hint.fade{opacity:0}

/* 上下文字带 */
.zone{
  position:fixed;left:0;right:0;z-index:5;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:0 1.2rem;pointer-events:none;
}
.zone button{pointer-events:auto}
#headZone{top:calc(env(safe-area-inset-top,0px) + 4.7rem)}
#footZone{bottom:calc(env(safe-area-inset-bottom,0px) + 1.2rem);gap:.3rem}

/* 进度 */
.below{display:flex;align-items:center;justify-content:center;gap:.75rem;margin-top:0;flex-wrap:wrap}
.dots{display:flex;gap:.42rem}
.dots i{
  display:block;width:.3rem;height:.3rem;border:1px solid var(--line);border-radius:50%;
  transition:background .45s,border-color .45s,transform .45s;
}
.dots i.done{background:var(--ink);border-color:var(--ink)}
.dots i.next{border-color:var(--seal);opacity:.8}
.note-line{font-size:.74rem;color:var(--ink-2);letter-spacing:.08em;min-height:1.2em}
.big-btn{
  min-height:2.9rem;border:1px solid var(--ink);background:transparent;color:var(--ink);
  border-radius:.35rem;padding:0 1.8rem;font-size:.88rem;letter-spacing:.2em;cursor:pointer;
  transition:background .25s,color .25s,border-color .25s;
}
.big-btn.solid{background:var(--ink);color:var(--cream)}
.big-btn.ghost{border-color:var(--line);color:var(--ink-2)}
.big-btn:active{transform:translateY(1px)}
.cta-row{display:flex;gap:.55rem;justify-content:center;align-items:center;margin-top:.8rem;flex-wrap:wrap}
.cta-row .tip{font-size:.74rem;color:var(--ink-3)}

/* ============ 完成页 ============ */
.done-view{position:fixed;inset:0;z-index:12;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.2rem 1.2rem 2.6rem;background:var(--veil)}
.done-view.show{display:block;animation:rise .55s ease both}
.done-card{width:min(100%,30rem);margin:0 auto;padding-top:1.4rem}
@keyframes rise{from{opacity:0;transform:translateY(.6rem)}to{opacity:1;transform:none}}
.streak-line{font-size:.74rem;color:var(--ink-3);letter-spacing:.14em;margin:.45rem 0 0}
.seal{
  width:2.4rem;height:2.4rem;margin:.1rem auto 1.15rem;border:1px solid var(--seal);color:var(--seal);
  display:grid;place-items:center;font:400 .8rem/1.1 var(--serif);letter-spacing:.06em;
  writing-mode:vertical-rl;transform:rotate(-2deg);
}
.light-row{display:flex;gap:.35rem;justify-content:center;flex-wrap:wrap;margin:.15rem 0 1.15rem}
.light-btn{
  border:1px solid var(--line);background:transparent;border-radius:.3rem;
  padding:.42rem 1.05rem;font-size:.8rem;cursor:pointer;color:var(--ink-2);letter-spacing:.16em;text-indent:.16em;
}
.light-btn[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:rgba(255,255,255,.55)}
.field{margin:1.1rem 0 0;text-align:left}
.field label{display:block;font-size:.7rem;letter-spacing:.2em;color:var(--ink-3);margin-bottom:.55rem}
.mood-row{display:flex;gap:.4rem;flex-wrap:wrap}
.mood-btn{
  min-width:4.6rem;min-height:2.6rem;border:1px solid var(--line);border-radius:.3rem;background:transparent;
  font-size:.88rem;cursor:pointer;font-family:var(--serif);color:var(--ink-2);letter-spacing:.06em;
}
.mood-btn[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:rgba(255,255,255,.55)}
textarea{
  display:block;width:100%;min-height:4.8rem;resize:vertical;border:0;border-bottom:1px solid var(--line);
  background:transparent;color:var(--ink);padding:.7rem .1rem;font-size:1rem;line-height:1.85;font-family:var(--serif);letter-spacing:.04em;
}
.counter{text-align:right;font-size:.7rem;color:var(--ink-3);margin-top:.25rem}
.done-actions{display:flex;flex-direction:column;gap:.5rem;align-items:stretch;margin-top:1.25rem}
.done-actions .big-btn{border-radius:.35rem;width:100%}
.alt-row{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:.35rem}
.link-btn{border:0;background:none;font-size:.82rem;color:var(--ink-2);text-decoration:underline;text-underline-offset:.25em;cursor:pointer;padding:.55rem .2rem;min-height:var(--tap)}
.link-btn.seal-c{color:var(--seal)}

/* ============ 抽屉 / 弹层 ============ */
.sheet,.modal{position:fixed;inset:0;z-index:20;display:none}
.sheet.open,.modal.open{display:block}
.sheet{background:rgba(24,38,33,.35)}
.sheet-panel{
  position:absolute;right:0;top:0;bottom:0;width:min(28rem,100%);background:var(--cream);
  padding:1.2rem 1.15rem 2.4rem;overflow-y:auto;box-shadow:-10px 0 30px var(--shadow);
  animation:slideIn .3s ease both;
}
@keyframes slideIn{from{transform:translateX(12px)}to{transform:none}}
.modal{background:rgba(24,38,33,.42);padding:.85rem;overflow-y:auto}
.modal-panel{
  position:relative;margin:.75rem auto;width:min(30rem,100%);background:var(--cream);border-radius:.9rem;
  padding:1.2rem 1.15rem 1.5rem;box-shadow:0 18px 40px rgba(20,32,26,.28);
}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.7rem;border-bottom:1px solid var(--line-2);padding-bottom:.75rem}
.modal-head h2{font:400 1.18rem/1.4 var(--serif);margin:0;letter-spacing:.06em}
.x{flex:none;min-width:var(--tap);min-height:var(--tap);border:1px solid transparent;border-radius:.6rem;background:none;cursor:pointer;display:grid;place-items:center}
.x:hover{background:rgba(255,255,255,.7);border-color:var(--line-2)}
.x svg{width:1.05rem;height:1.05rem}
.rows{margin-top:.5rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--line-2);padding:.85rem 0}
.row:last-child{border-bottom:0}
.row p{margin:.25rem 0 0;font-size:.74rem;color:var(--ink-3);line-height:1.6}
.row b{font-weight:500;font-size:.95rem}
.switch{min-width:4.4rem;min-height:2.3rem;border:1px solid var(--line);border-radius:2rem;background:rgba(255,255,255,.5);font-size:.78rem;cursor:pointer;padding:0 .8rem}
.switch[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.mini{border:1px solid var(--seal);color:var(--seal);background:none;border-radius:.5rem;min-height:2.4rem;padding:0 .85rem;font-size:.8rem;cursor:pointer}
.entry{display:grid;grid-template-columns:4.2rem 1fr;gap:.85rem;border-bottom:1px solid var(--line-2);padding:.95rem 0}
.entry img{width:4.2rem;height:5.25rem;object-fit:cover;border:1px solid var(--line-2);border-radius:.3rem;background:var(--paper)}
.entry .meta{display:flex;justify-content:space-between;gap:.5rem;font-size:.7rem;color:var(--ink-3)}
.entry .nm{font:400 1rem/1.5 var(--serif);margin:.25rem 0 .1rem}
.entry .tx{font-size:.78rem;color:var(--ink-2);margin:.15rem 0 0;line-height:1.65}
.entry .ops{display:flex;gap:.9rem;justify-content:flex-start;margin-top:.45rem}
.entry .ops button{border:0;background:none;padding:.35rem 0;font-size:.76rem;text-decoration:underline;text-underline-offset:.25em;cursor:pointer;min-height:1.8rem}
.entry .ops .del{color:var(--seal)}
.empty{color:var(--ink-3);font-size:.86rem;text-align:center;line-height:2;padding:2.6rem .5rem}
.preview img{display:block;width:min(16rem,72%);margin:.4rem auto .8rem;border:1px solid var(--line-2);border-radius:.4rem}
.preview p{text-align:center;font-size:.84rem;color:var(--ink-2);line-height:1.85;margin:0 0 .3rem}
.kv{display:flex;justify-content:center;gap:.6rem;flex-wrap:wrap;font-size:.74rem;color:var(--ink-3);margin-top:.35rem}

/* ============ 引导 ============ */
.coach{position:fixed;inset:0;z-index:40;background:rgba(230,229,216,.985);display:none;padding:1rem;overflow-y:auto}
.coach.open{display:grid;place-items:center}
.coach-card{width:min(30rem,100%);text-align:center}
.steps{display:flex;gap:.35rem;justify-content:center;margin-bottom:1.35rem}
.steps i{width:1.6rem;height:.2rem;border-radius:1rem;background:var(--line);transition:background .3s}
.steps i.on{background:var(--ink)}
.demo{position:relative;width:min(14.5rem,60vw);aspect-ratio:1;margin:0 auto 1.1rem}
.demo .ring{position:absolute;inset:12%;border:1.5px solid var(--ink);border-radius:50%;opacity:.5;animation:demoBreath 5.6s ease-in-out infinite}
.demo .core{position:absolute;inset:31%;border-radius:47% 53% 45% 55%;background:linear-gradient(155deg,#efedde,#93a184);box-shadow:inset 0 -6px 14px rgba(30,44,38,.2),0 6px 14px rgba(30,44,38,.14)}
.demo .finger{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);animation:demoPress 5.6s ease-in-out infinite}
.demo .finger svg{width:2rem;height:2rem;filter:drop-shadow(0 2px 3px rgba(30,44,38,.3))}
@keyframes demoBreath{0%,8%{transform:scale(.86)}45%,55%{transform:scale(1.06)}92%,100%{transform:scale(.86)}}
@keyframes demoPress{0%,8%{opacity:.25;transform:translate(-50%,-64%)}22%,55%{opacity:1;transform:translate(-50%,-50%)}72%{opacity:.5;transform:translate(-50%,-40%)}92%,100%{opacity:.25;transform:translate(-50%,-64%)}}
.coach h2{font:400 1.35rem/1.6 var(--serif);margin:0 0 .55rem;letter-spacing:.05em}
.coach p{font-size:.95rem;color:var(--ink-2);line-height:2;margin:0 auto 1.15rem;max-width:24rem}
.coach p em{font-style:normal;color:var(--seal);border-bottom:1px solid rgba(163,69,47,.35)}
.coach-foot{display:flex;gap:.6rem;justify-content:center;align-items:center;flex-wrap:wrap}
.coach-foot .skip{border:0;background:none;color:var(--ink-3);font-size:.8rem;text-decoration:underline;text-underline-offset:.25em;cursor:pointer;padding:.6rem}

/* 夜色下场景内卡片已由全局变量接管 */

.foot{text-align:center;font-size:.7rem;color:var(--ink-3);letter-spacing:.06em;padding:.4rem 1rem 1.1rem;line-height:1.7}
.toast{  position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%) translateY(.6rem);z-index:60;
  background:var(--ink);color:var(--cream);font-size:.82rem;padding:.7rem 1.05rem;border-radius:.55rem;
  opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;max-width:calc(100% - 2rem);
}
.toast.show{opacity:1;transform:translateX(-50%)}
.sr{position:absolute;left:.6rem;top:-4rem;width:auto;height:auto;overflow:hidden;clip:auto;white-space:nowrap;padding:.55rem .9rem;background:var(--ink);color:var(--cream);border-radius:.4rem;font-size:.85rem;z-index:80;transition:top .18s}
.sr:focus{top:.6rem}
:focus-visible{outline:3px solid rgba(163,69,47,.5);outline-offset:3px;border-radius:.3rem}
@media(max-width:640px){
  .top{padding:.7rem .85rem .2rem}
  .foot{display:none}
  .brand b{font-size:.98rem}.brand small{display:none}
  .tool-label{display:none}
  .main{padding:.1rem .85rem 2rem}
}
@media(max-height:760px){
  .top{padding:.55rem .85rem 0}
  .brand-mark{width:1.75rem;height:1.75rem;font-size:.82rem}
  .kicker{display:none}
  .h1{font-size:1.12rem;margin-bottom:.3rem}
  .lede{display:none}
  #headZone{top:calc(env(safe-area-inset-top,0px) + 3.9rem)}
  .hint{display:none}
  #footZone{bottom:.9rem}
  .big-btn{min-height:2.7rem;font-size:.88rem}
  .cta-row{margin-top:.55rem}
}
@media(max-height:600px){
  .chips{display:none}
  .center{top:2.7rem}
}
@media(max-height:900px){
  html.elder .lede{display:none}
  html.elder .h1{font-size:1.2rem}
}
html.elder #headZone{top:calc(env(safe-area-inset-top,0px) + 5.1rem)}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .demo .ring,.demo .finger{animation:none}
}
</style>
</head>
<body>
<a class="sr" href="#hit">跳到练习区</a>
<div class="app">
  <div class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">息</div>
      <div><b>呼吸石</b><small>A BREATHING GARDEN</small></div>
    </div>
    <div class="tools">
      <button class="tool" id="helpBtn" type="button" title="怎么玩">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.2 2.6c-.6.2-.8.7-.8 1.4"/><circle cx="12" cy="17" r=".7" fill="currentColor" stroke="none"/></svg>
        <span class="tool-label">怎么玩</span>
      </button>
      <button class="tool" id="soundBtn" type="button" aria-pressed="false" aria-label="声音" title="声音">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10v4h3.5L13 18V6L7.5 10H4Z"/><path d="M16.5 9.5a3.6 3.6 0 0 1 0 5"/></svg>
      </button>
      <button class="tool" id="archiveBtn" type="button" title="我的收藏">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 4h12v16l-6-3.2L6 20V4Z"/></svg>
        <span class="tool-label">收藏</span>
      </button>
      <button class="tool" id="setBtn" type="button" title="设置">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.1"/><path d="M12 3.4v2M12 18.6v2M3.4 12h2M18.6 12h2M6 6l1.4 1.4M16.6 16.6 18 18M18 6l-1.4 1.4M7.4 16.6 6 18"/></svg>
      </button>
    </div>
  </div>

  <div class="scene" id="scene">
    <canvas id="art" aria-hidden="true"></canvas>
    <button class="hit" id="hit" type="button" aria-label="按住这块石头，吸气；松手，呼气"></button>
    <div class="center">
      <div class="count" id="count">0 / 6 圈</div>

<script>

var MOOD_LABELS = {'平静':'平静','有点乱':'有点乱','累':'累','松快了':'松快了'};

/* ===================== 存储（可失败） ===================== */
var memory = null;             /* localStorage 不可用时的内存回退 */
var hasLS = false;
try {

} catch (e) { hasLS = false; }

var store = {stones:[], prefs:{sound:false, haptics:true, elder:false, guided:false, pattern:'calm', input:'hold', light:'dawn', ambient:true, garden:{n:0, streak:0, lastDay:''}}};

function readRaw(){
  try { return hasLS ? localStorage.getItem(KEY) : memory; } catch(e){ return null; }
}
function writeRaw(v){
  try { if(hasLS){ localStorage.setItem(KEY, v); } else { memory = v; } }
  catch(e){ toast('这台设备的存储被限制了，今天照样能坐，只是收藏可能留不住'); }
}
function load(){
  var raw = readRaw();
  if(!raw) return;
  var data;

    if(isArray(data.stones)){
      for(var i=0;i<data.stones.length;i++) store.stones.push(normalize(data.stones[i], i));
    }
    if(data.preferences) assign(store.prefs, data.preferences);
    if(data.prefs) assign(store.prefs, data.prefs);

    for(var j=0;j<data.length;j++) store.stones.push(normalize(data[j], j));
  }

  if(!PATTERNS[store.prefs.pattern]) store.prefs.pattern = 'calm';
}
function save(){
  writeRaw(JSON.stringify({version:VER, stones:store.stones, prefs:store.prefs}));
}
function normalize(x, i){
  x = x || {};
  var light = x.light || x.atmosphere;
  if(light === 'moss' || light === 'rain') light = 'dawn';
  if(light === 'moon') light = 'night';
  if(!LIGHTS[light]) light = store.prefs.light || 'dawn';
  var note = String(x.note == null ? '' : x.note).slice(0,60);
  return {
    id:x.id || ('s' + (Date.now() + i)),
    seed:num(x.seed, rand32()),
    name:x.name || NAMES[i % NAMES.length],
    date:x.date || new Date().toISOString(),
    light:light,
    mood:x.mood || '',

    rings:clamp(num(x.rings, TARGET), 1, TARGET + EXTRA),
    detail:(x.detail && isArray(x.detail)) ? x.detail.slice(0, TARGET + EXTRA) : null,

}

/* ===================== 小工具 ===================== */
function isArray(v){ return Object.prototype.toString.call(v) === '[object Array]'; }
function num(v, d){ var n = Number(v); return isFinite(n) ? n : d; }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function assign(t, s){ if(!s) return t; for(var k in s){ if(Object.prototype.hasOwnProperty.call(s,k)) t[k] = s[k]; } return t; }
function rand32(){ return Math.floor(Math.random() * 4294967295) >>> 0; }
function seeded(seed){

  return function(){ n = (n * 1664525 + 1013904223) >>> 0; return n / 4294967296; };
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function $(id){ return document.getElementById(id); }
function dayLabel(d){
  try {
    return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric'}).format(d);
  } catch(e){
    return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
  }
}
function mmss(sec){
  var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ' 分 ' + (s < 10 ? '0' : '') + s + ' 秒';
}
/* 庭院成长：每收好一张石笺，院子绿一点 */
function dayKey(d){ return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function gardenLevel(){
  var g = store.prefs.garden;
  var n = (g && g.n) ? g.n : 0;
  return n <= 0 ? 0 : (n >= 15 ? 4 : (n >= 9 ? 3 : (n >= 5 ? 2 : 1)));
}
function gardenBump(){
  var g = store.prefs.garden || (store.prefs.garden = {n:0, streak:0, lastDay:''});
  var before = gardenLevel();
  var now = new Date(), today = dayKey(now), y = new Date(now.getTime() - 864e5);
  if(g.lastDay !== today){
    g.streak = (g.lastDay === dayKey(y)) ? (g.streak || 0) + 1 : 1;
    g.lastDay = today;
  }
  g.n = (g.n || 0) + 1;
  save();
  return gardenLevel() > before;
}
var toastTimer = 0;
function toast(text){
  var el = $('toast');
  if(!el) return;
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
}
function buzz(ms){
  if(!store.prefs.haptics) return;
  try { if(navigator.vibrate) navigator.vibrate(ms || 12); } catch(e){}
}

/* ===================== 状态 ===================== */
var state = {
  screen:'calibration',    /* calibration | ritual | done */
  input:'hold',
  rings:[], draft:null, pressed:false, pressStart:0,
  trace:[], traceSpan:0,
  seed:rand32(), note:'', mood:'',
  offset:{x:0,y:0}, drag:null,
  savedCurrent:false, beganAt:0, seconds:0, breathMs:0, lastRelease:0, selected:null, extra:false,
  dropAt:0
};
var canvas = $('art'), ctx = canvas.getContext('2d');
var scene = $('scene'), hit = $('hit');
var bg = document.createElement('canvas'), bgKey = '';
var W = 1, H = 1, U = 320, CX = 0, CY = 0, HY = 0, DPR = 1, raf = 0, t0 = 0, running = true;
var ripples = [], lanternPos = {x:0, y:0, r:0};
var amb = {dust:[], petals:[], flies:[], sparks:[], bird:null, nextEv:7000, gustAt:-9999, flash:-9999};
var reduced = {matches:false};
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)'); } catch(e){}

/* ===================== 画布 ===================== */
function resize(){
  DPR = clamp(window.devicePixelRatio || 1, 1, 2.5);
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  U = Math.max(190, Math.min(W, H * .92, (H * .40 - 150) / .325));
  CX = Math.round(W * .47); CY = Math.round(H * .60); HY = Math.round(H * .48);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  var hw = Math.min(W * .66, U * .78);
  hit.style.width = Math.round(hw) + 'px';
  hit.style.height = Math.round(hw * .72) + 'px';
  bgKey = '';
  buildAmbient();
}
function buildAmbient(){
  var rand = seeded(state.seed + 33), L = LIGHTS[store.prefs.light], lv = gardenLevel();
  amb.dust = []; amb.petals = []; amb.flies = []; amb.sparks = []; amb.bird = null;
  var nd = reduced.matches ? 4 : 12;
  for(var i=0;i<nd;i++){
    amb.dust.push({x:rand()*W, y:rand()*H, r:.3 + rand()*.7,
      vx:(rand()-.5)*.004, vy:-(.0012 + rand()*.0028), a:.03 + rand()*.06});
  }
  var np = (reduced.matches || !store.prefs.ambient) ? 0 : 4 + lv;
  for(var j=0;j<np;j++) amb.petals.push(newPetal(rand, true));
  if(L.night && store.prefs.ambient && !reduced.matches){
    var nf = 5 + lv;
    for(var k=0;k<nf;k++){
      amb.flies.push({bx:rand()*W, by:HY + 18 + rand()*(H - HY - 52),
        ph:rand()*6.283, f1:.5 + rand()*.9, f2:.4 + rand()*.7, s:.7 + rand()*.6});
    }
  }
}
function newPetal(rand, anywhere){
  return {x:rand()*W, y:anywhere ? rand()*H*.85 : -12,
    vy:.012 + rand()*.02, vx:(rand()-.5)*.012,
    rot:rand()*6.283, rs:(rand()-.5)*.002, sz:U*(.006 + rand()*.008),
    a:.4 + rand()*.5, ph:rand()*6.283};

/* 卵石轮廓：只用两个低频谐波，保持干净 */
function pebble(c, cx, cy, rx, ry, phase, flat){
  var k = flat == null ? .16 : flat;
  c.beginPath();
  for(var i=0;i<=110;i++){
    var a = i/110*Math.PI*2;
    var wob = 1 + Math.sin(a*2 + phase)*.035 + Math.sin(a*3 - phase*.7)*.018;
    var under = Math.max(0, Math.sin(a));
    var x = cx + Math.cos(a)*rx*wob;
    var y = cy + Math.sin(a)*ry*wob*(1 - k*under);
    if(i) c.lineTo(x,y); else c.moveTo(x,y);
  }
  c.closePath();
}
/* 单笔：起收笔有锋，中段略重 */
function inkArc(c, cx, cy, r, a0, a1, squash, color, weight, alpha, phase, segs){
  var n = segs || 132, rand = seeded((phase*1000)|0 || 7);

    var t0 = i/n, t1 = (i+1)/n;
    var env = Math.pow(Math.sin(Math.PI*Math.min(1,Math.max(0,t0))), .42);
    var dry = rand() > .965 ? .18 : 1;                /* 飞白 */
    if(dry < .5) continue;
    var b0 = a0 + (a1-a0)*t0, b1 = a0 + (a1-a0)*t1;
    var w0 = 1 + Math.sin(b0*3 + phase)*.012 + Math.sin(b0*5 - phase)*.007;

    c.lineWidth = Math.max(.35, weight*(.34 + .66*env));
    c.beginPath();
    c.moveTo(cx + Math.cos(b0)*r*w0, cy + Math.sin(b0)*r*squash*w0);
    c.lineTo(cx + Math.cos(b1)*r*w1, cy + Math.sin(b1)*r*squash*w1);
    c.stroke();
  }
  c.globalAlpha = 1; c.restore();
}
/* 山脊：一根线，不填充 */
function ridgeLine(c, y, amp, color, alpha, seedn, bend){
  var rand = seeded(seedn);
  c.save(); c.strokeStyle = color; c.globalAlpha = alpha; c.lineWidth = .9; c.lineCap = 'round';
  c.beginPath();
  for(var i=0;i<=60;i++){
    var x = i/60*W;
    var yy = y - (Math.sin(i/60*Math.PI*(1+bend))*amp) - (rand()-.5)*amp*.05;
    if(i) c.lineTo(x, yy); else c.moveTo(x, yy);
  }
  c.stroke(); c.restore(); c.globalAlpha = 1;
}
function paintStatic(c){
  var L = LIGHTS[store.prefs.light];

  /* 天：上半幅是雾色 */
  var g = c.createLinearGradient(0, 0, 0, hy);

  var tr = seeded(state.seed + 17);
  var tn = 8 + Math.floor(tr() * 5);

      c.fillStyle = L.mossDeep; c.globalAlpha = L.night ? .22 : .3;

  }

  vg.addColorStop(0, 'rgba(0,0,0,0)');

  c.fillStyle = vg; c.fillRect(0, 0, W, H);

function drawLantern(c, L, hy, lv){
  /* 位置固定在主石另一侧，大小随院子成长一点点 */

  var s = clamp(U*.055, 15, 44) * (1 + lv*.04);
  var x = CX + side * Math.max(W*.28, U*.34);
  var base = hy + (H - hy)*.34 + (state.seed % 7)*H*.008;
  lanternPos = {x:x, y:base - s*1.9, r:s*1.15};
  c.save(); c.translate(x, base);
  var fill = L.night ? '#20291f' : L.lantern;
  c.globalAlpha = L.night ? .9 : .62;
  c.fillStyle = fill;
  /* 座 */
  c.fillRect(-s*.34, -s*.16, s*.68, s*.16);
  c.fillRect(-s*.2, -s*.78, s*.4, s*.62);
  /* 灯室 */
  c.fillRect(-s*.3, -s*1.16, s*.6, s*.38);
  /* 笠 */
  c.beginPath();
  c.moveTo(-s*.46, -s*1.16); c.lineTo(s*.46, -s*1.16); c.lineTo(s*.26, -s*1.4); c.lineTo(-s*.26, -s*1.4);
  c.closePath(); c.fill();
  /* 宝珠 */
  c.beginPath(); c.arc(0, -s*1.5, s*.08, 0, 6.283); c.fill();
  /* 窗 */
  c.globalAlpha = 1;
  c.fillStyle = L.night ? L.glow : 'rgba(40,48,38,.4)';
  c.fillRect(-s*.12, -s*1.08, s*.24, s*.22);
  if(L.night){
    var gg = c.createRadialGradient(0, -s*.97, 1, 0, -s*.97, s*1.5);
    gg.addColorStop(0, L.glow); gg.addColorStop(1, 'rgba(240,206,128,0)');
    c.fillStyle = gg; c.globalAlpha = .32;
    c.beginPath(); c.arc(0, -s*.97, s*1.5, 0, 6.283); c.fill();
  }
  c.restore(); c.globalAlpha = 1;
}
function drawCompanions(c, L){
  var rnd = seeded(state.seed + 77);

  var by = CY + U * (.09 + rnd() * .04);
  var defs = [[.62, .09], [.38, .145]];
  for(var i=0;i<2;i++){
    var rx = U * .142 * defs[i][0] * (1 + (rnd()-.5)*.12);
    var ry = rx * (.58 + rnd() * .18);
    var px = bx + U * defs[i][1], py = by + U * .045 * (i + .6);
    var rot = (i === 0 ? 1 : -1) * (.09 + rnd() * .09);

    var sh = c.createRadialGradient(0, ry*1.2, 1, 0, ry*1.2, rx*1.5);
    sh.addColorStop(0, L.night ? 'rgba(4,8,5,.5)' : 'rgba(52,64,46,.24)');
    sh.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = sh;
    c.beginPath(); c.ellipse(0, ry*1.2, rx*1.5, ry*.34, 0, 0, Math.PI*2); c.fill();
    var gd = c.createLinearGradient(-rx*.4, -ry, rx*.4, ry);
    gd.addColorStop(0, L.stone[0]); gd.addColorStop(.58, L.stone[1]); gd.addColorStop(1, L.stone[2]);
    c.fillStyle = gd;
    var ph = rnd() * 6.283;
    pebble(c, 0, 0, rx, ry, ph, .18);
    c.fill();
    c.save();
    c.beginPath(); c.rect(-rx*1.2, -ry*1.6, rx*2.4, ry*1.8); c.clip();
    c.strokeStyle = L.ink; c.globalAlpha = L.night ? .16 : .1; c.lineWidth = .7; c.lineCap = 'round';
    pebble(c, 0, 0, rx, ry, ph, .18);
    c.stroke();
    c.restore();
    c.globalAlpha = L.night ? .4 : .48;
    c.fillStyle = L.moss[2];
    c.beginPath(); c.ellipse(-rx*.3, ry*.86, rx*.5, ry*.2, 0, 0, Math.PI*2); c.fill();
    c.globalAlpha = 1;
    c.restore();
  }
}
function drawStone(c, breath, isStatic, lift){
  var L = LIGHTS[store.prefs.light];
  /* 每颗石头由种子决定：胖瘦、倾斜、隆起、苔位都不同 */
  var sp = seeded(state.seed + 5);
  var grow = 1 + state.rings.length*.006;
  var cx = CX + state.offset.x, cy = CY + state.offset.y - (lift || 0);
  var sz = .9 + sp()*.2;
  var rx = U*.142*sz*grow*(1 + breath*.035);
  var ry = rx*(.66 + sp()*.2)*(1 + breath*.02);
  var tilt = (sp()-.5)*.08;
  var lumpy = sp()*6.283;
  c.save(); c.translate(cx, cy); c.rotate(tilt);

  /* 石头半没在苔里：影子贴地不随石头起落 */
  var shy = ry*1.22 + (lift || 0);
  var sha = (L.night ? .6 : .32) * (1 - (lift || 0)/12);
  var shA = 'rgba(4,8,5,' + sha.toFixed(3) + ')', shB = 'rgba(56,70,50,' + sha.toFixed(3) + ')';
  var sh = c.createRadialGradient(0, shy, 1, 0, shy, rx*1.7);
  sh.addColorStop(0, L.night ? shA : shB);
  sh.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = sh;
  c.beginPath(); c.ellipse(0, shy, rx*1.7, ry*.4, 0, 0, Math.PI*2); c.fill();

  /* 浅白石体 */
  var grad = c.createLinearGradient(-rx*.4, -ry, rx*.4, ry);
  grad.addColorStop(0, L.stone[0]);
  grad.addColorStop(.58, L.stone[1]);
  grad.addColorStop(1, L.stone[2]);
  c.fillStyle = grad;
  pebble(c, 0, 0, rx, ry, lumpy, .16);
  c.fill();

  /* 青苔：贴着下缘长，位置随种子 */
  c.save();
  pebble(c, 0, 0, rx, ry, lumpy, .16);
  c.clip();
  var mc = 3 + Math.floor(sp()*4) + gardenLevel();
  for(var i=0;i<mc;i++){
    var ma = Math.PI*(.18 + sp()*.64);
    var mx = -Math.cos(ma)*rx*(.35 + sp()*.55);
    var my = Math.sin(ma)*ry*.88;
    c.globalAlpha = L.night ? (.16 + sp()*.14) : (.2 + sp()*.18);
    c.fillStyle = L.moss[i % 3];
    c.beginPath();
    c.ellipse(mx, my, rx*(.12 + sp()*.16), ry*(.14 + sp()*.15), lumpy + i, 0, Math.PI*2);
    c.fill();
  }
  /* 几粒小砂 */
  for(var s2=0;s2<6;s2++){
    c.globalAlpha = .06 + sp()*.06;
    c.fillStyle = L.ink;
    c.beginPath();
    c.arc((sp()-.5)*rx*1.5, (sp()-.5)*ry*1.6, rx*.012 + sp()*rx*.014, 0, Math.PI*2);
    c.fill();
  }
  c.globalAlpha = 1;
  c.restore();

  /* 受光面一笔细线 */
  c.save();
  c.beginPath();
  c.rect(-rx*1.2, -ry*1.7, rx*2.4, ry*1.9);
  c.clip();
  c.strokeStyle = L.ink; c.globalAlpha = L.night ? .2 : .13; c.lineWidth = .8; c.lineCap = 'round';
  pebble(c, 0, 0, rx, ry, lumpy, .16);
  c.stroke();
  c.restore();

  /* 苔领：地面的苔漫上石脚，把石头嵌进院子 */
  var co = seeded(state.seed + 13);
  for(var ci=0;ci<4;ci++){
    var ca = Math.PI*(.15 + ci*.23 + co()*.08);
    var cxx = Math.cos(ca)*rx*(.62 + co()*.3);
    var cyy = Math.sin(ca)*ry*1.02 + ry*.04;
    c.globalAlpha = L.night ? (.48 + co()*.18) : (.52 + co()*.2);
    c.fillStyle = L.moss[2];
    c.beginPath(); c.ellipse(cxx, cyy, rx*(.1 + co()*.1), ry*(.1 + co()*.08), 0, 0, Math.PI*2); c.fill();
  }
  c.globalAlpha = 1;
  c.restore();
}
function stepAmbient(c, t, dt){
  var L = LIGHTS[store.prefs.light];
  var live = store.prefs.ambient && !reduced.matches;
  /* 浮尘 */
  for(var i=0;i<amb.dust.length;i++){
    var p = amb.dust[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.y < -6){ p.y = H + 6; }
    if(p.x < -6){ p.x = W + 6; } if(p.x > W + 6){ p.x = -6; }
    c.globalAlpha = p.a; c.fillStyle = L.night ? 'rgba(226,230,212,.7)' : L.ink;
    c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.283); c.fill();
  }
  c.globalAlpha = 1;
  drawSparks(c, t, dt);
  if(!live) return;
  /* 落花：慢慢飘，落到底就回到天上 */
  var gk = gustStrength(t);
  for(var j=0;j<amb.petals.length;j++){
    var f = amb.petals[j];
    f.y += f.vy*dt; f.x += (f.vx + gk*.02)*dt + Math.sin(t/900 + f.ph)*.1;
    f.rot += f.rs*dt;
    if(f.y > H + 14 || f.x < -20 || f.x > W + 20){ f.y = -12; f.x = Math.random()*W; }
    c.save(); c.translate(f.x, f.y); c.rotate(f.rot);
    c.globalAlpha = f.a * (L.night ? .5 : 1);
    c.fillStyle = L.petal;
    c.beginPath(); c.ellipse(0, 0, f.sz, f.sz*.55, 0, 0, 6.283); c.fill();
    c.restore();
  }
  c.globalAlpha = 1;
  /* 萤火：夜里的慢眨眼 */
  for(var k=0;k<amb.flies.length;k++){
    var fl = amb.flies[k];
    var fx = fl.bx + Math.sin(t*.0004*fl.f1 + fl.ph)*U*.09;
    var fy = fl.by + Math.cos(t*.00033*fl.f2 + fl.ph)*H*.02;
    var gl = Math.max(0, Math.sin(t*.0018*fl.s + fl.ph*3));
    gl = gl*gl*(.25 + .75*Math.max(0, Math.sin(t*.0006 + fl.ph)));
    if(gl < .02) continue;
    c.globalAlpha = gl*.9; c.fillStyle = L.fire;
    c.beginPath(); c.arc(fx, fy, 1.15, 0, 6.283); c.fill();
    c.globalAlpha = gl*.15;
    c.beginPath(); c.arc(fx, fy, 4.5, 0, 6.283); c.fill();
  }
  c.globalAlpha = 1;
  /* 随机小事件：风过，或者水鸟掠过 */
  if(t > amb.nextEv){
    amb.nextEv = t + 14000 + Math.random()*22000;
    var roll = Math.random();
    if(roll < .55){
      amb.gustAt = t;
      var rn = seeded(((t|0) + state.seed) >>> 0);
      for(var q=0;q<3;q++) amb.petals.push(newPetal(rn, false));
      if(amb.petals.length > 13) amb.petals.splice(0, amb.petals.length - 13);
    } else if(roll < .8 && !amb.bird){
      amb.bird = {x:-30, y:H*(.2 + Math.random()*.1), v:.035 + Math.random()*.02};
    }
  }
  if(amb.bird){
    var b = amb.bird; b.x += b.v*dt;
    var wing = Math.sin(t/110)*3.2;
    c.strokeStyle = L.ink; c.globalAlpha = L.night ? .32 : .18; c.lineWidth = 1; c.lineCap = 'round';
    c.beginPath();
    c.moveTo(b.x - 5, b.y + wing*.4); c.quadraticCurveTo(b.x - 2, b.y - 2, b.x, b.y);
    c.quadraticCurveTo(b.x + 2, b.y - 2, b.x + 5, b.y + wing*.4);
    c.stroke(); c.globalAlpha = 1;
    if(b.x > W + 30) amb.bird = null;
  }
  drawBranch(c, t, gk);
  /* 碰了灯笼：光洸一下 */
  var fd = t - amb.flash;
  if(fd >= 0 && fd < 900){
    var fk = 1 - fd/900;
    var lg = c.createRadialGradient(lanternPos.x, lanternPos.y, 1, lanternPos.x, lanternPos.y, lanternPos.r*2.6);
    lg.addColorStop(0, 'rgba(240,214,150,' + (.42*fk).toFixed(3) + ')'); lg.addColorStop(1, 'rgba(240,214,150,0)');
    c.fillStyle = lg;
    c.beginPath(); c.arc(lanternPos.x, lanternPos.y, lanternPos.r*2.6, 0, 6.283); c.fill();
  }
}
function gustStrength(t){
  var d = t - amb.gustAt;
  if(d < 0 || d > 3600) return 0;
  return Math.exp(-d/1400) * Math.abs(Math.sin(d/300)) * .9;
}
function drawBranch(c, t, gust){
  var L = LIGHTS[store.prefs.light];
  var sw = Math.sin(t/2400)*2 + gust*6;
  var side = 1;
  var x0 = W/2 + side*W*.46, y0 = -4;
  var x1 = x0 - side*W*.1, y1 = H*.03;
  var x2 = x0 - side*W*.3 + side*sw, y2 = H*.095 + Math.abs(sw)*.35;
  c.save();
  c.strokeStyle = L.ink; c.globalAlpha = L.night ? .45 : .17; c.lineWidth = 1.1; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo(x1, y1, x2, y2); c.stroke();
  var lr = seeded(state.seed + 91);
  c.fillStyle = L.ink; c.globalAlpha = L.night ? .4 : .12;
  for(var i=0;i<7;i++){
    var u = .28 + i*.1 + lr()*.05;
    var bx = (1-u)*(1-u)*x0 + 2*(1-u)*u*x1 + u*u*x2;
    var by = (1-u)*(1-u)*y0 + 2*(1-u)*u*y1 + u*u*y2;
    c.beginPath(); c.ellipse(bx, by, U*.014 + lr()*U*.008, U*.005, lr()*3.14 + sw*.02, 0, 6.283); c.fill();
  }
  c.restore(); c.globalAlpha = 1;
}
function drawSparks(c, t, dt){
  for(var i=amb.sparks.length-1;i>=0;i--){
    var s = amb.sparks[i];
    var age = t - s.born;
    if(age > s.life){ amb.sparks.splice(i,1); continue; }
    s.x += s.vx*dt; s.y += s.vy*dt; s.vy += .00003*dt;
    var a = 1 - age/s.life;
    c.globalAlpha = a*s.al; c.fillStyle = s.col;
    c.beginPath(); c.arc(s.x, s.y, s.r*(.6 + a*.6), 0, 6.283); c.fill();
  }
  c.globalAlpha = 1;
}

function drawDraft(c, k, t){

    c.beginPath(); c.arc(cx + Math.cos(ph - 2.5 + 6.05)*rad, cy + Math.sin(ph - 2.5 + 6.05)*rad*.93, U*.008, 0, Math.PI*2); c.fill();

}
function drawRipples(c, t){
  var L = LIGHTS[store.prefs.light];
  for(var i=ripples.length-1;i>=0;i--){
    var rp = ripples[i], age = t - rp.born, life = 1300;
    if(age > life){ ripples.splice(i,1); continue; }

}
function ripple(x, y){

}
function drawDrop(c, t){
  if(!state.dropAt) return;
  var d = t - state.dropAt;
  if(d > 5600){ state.dropAt = 0; return; }
  var L = LIGHTS[store.prefs.light];
  var lx = CX + U*.21, ly = CY + U*.15;
  var x, y, rot, al = 1;
  if(d < 900){
    var p = d/900, e = 1 - Math.pow(1 - p, 3);

function frame(now){
  raf = requestAnimationFrame(frame);
  if(!running) return;
  var t = now || 0;
  if(!t0) t0 = t;
  try {
    var key = [W,H,DPR,store.prefs.light,state.rings.length,state.seed,store.prefs.elder,gardenLevel()].join('|');
    if(key !== bgKey){
      bg.width = canvas.width; bg.height = canvas.height;
      var bc = bg.getContext('2d');
      bc.setTransform(DPR,0,0,DPR,0,0);
      bc.clearRect(0,0,W,H);
      paintStatic(bc);
      bgKey = key;
    }
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(DPR,0,0,DPR,0,0);

    var P = PATTERNS[store.prefs.pattern];
    var k = 0, breath = 0;
    if(state.pressed){
      k = clamp((t - state.pressStart) / (P.inhale*1000), 0, 1);
      breath = k;
    } else if(state.screen === 'ritual' && !reduced.matches){
      var cyc = P.inhale + P.exhale;
      var pos = ((t/1000) % cyc) / cyc;
      breath = Math.sin(pos*Math.PI*2) * .5 + .5;
      breath = breath * .28;
    }
    /* 主石是活的：吸气微微浮起，呼气慢慢落回苔里 */
    var lift = 0;
    if(!reduced.matches && state.screen !== 'done'){
      if(state.pressed) lift = k*3;

    }
    drawStone(ctx, breath, false, lift);
    drawDrop(ctx, t);
    var dt = frame.lastT ? Math.min(80, t - frame.lastT) : 16;
    frame.lastT = t;
    stepAmbient(ctx, t, dt);
    if(state.pressed) drawDraft(ctx, k, t);
    else if(state.screen === 'ritual'){
      /* 下一笔落在哪里：一根虚线引导 */
      var cx = CX + state.offset.x, cy = CY + state.offset.y;
      var rr = U*(.168 + state.rings.length*.0305)*(.965 + breath*.05);
      ctx.save();
      ctx.setLineDash([1, 7]);
      ctx.globalAlpha = .1 + breath*.14;
      ctx.strokeStyle = LIGHTS[store.prefs.light].ink;
      ctx.lineWidth = .9; ctx.lineCap = 'round';

      ctx.restore(); ctx.globalAlpha = 1;
    }
    /* 吸气时石头微微承光 */
    if(state.pressed || breath > .02){
      ctx.save();
      var g = ctx.createRadialGradient(CX, CY, 2, CX, CY, U*(.22 + breath*.1));
      g.addColorStop(0, LIGHTS[store.prefs.light].halo); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = .22 + breath*.3; ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H); ctx.restore(); ctx.globalAlpha = 1;
    }
    drawRipples(ctx, t);
    if(t - (frame.last || 0) > 200){ frame.last = t; if(state.screen === 'ritual' && !document.hidden) updateLive(); }
  } catch(e){
    if(window.console && console.warn) console.warn('draw skipped', e);
  }
}

/* ===================== 呼吸逻辑 ===================== */
function pressStart(){
  if(state.screen === 'done') return;
  if(state.finishing) return;
  if(state.pressed) return;
  if(state.screen === 'calibration') startRitual();
  state.pressed = true;
  state.pressStart = performance.now();
  state.draftPhase = seeded(state.seed + state.rings.length*131)()*6.283;
  state.trace = []; state.traceSpan = 0;
  renderAll();
  updateLive();
}
function updateLive(){
  var P = PATTERNS[store.prefs.pattern];
  if(state.finishing){
    $('noteLine').textContent = '六圈圆满 · 等一片叶落进苔里';
    return;
  }
  if(state.pressed){
    var held = (performance.now() - state.pressStart) / 1000;
    if(state.input === 'trace'){
      $('noteLine').textContent = '沿石头描一圈 · 已经走过 ' + Math.round(clamp(state.traceSpan/6.283,0,1)*100) + '%';
    } else if(held < P.inhale - .4){
      $('noteLine').textContent = '吸气中 · 再数 ' + Math.max(1, Math.ceil(P.inhale - held)) + ' 秒';
    } else if(held < P.inhale + 2.2){
      $('noteLine').textContent = '满了 · 可以松手呼气';
      verb('很好，松手吧', '呼气，让它慢慢落下');
    } else {
      $('noteLine').textContent = '不急，慢慢呼出去';
    }
  } else if(state.screen === 'ritual' && state.lastRelease){
    /* 呼气也有计时 */
    var sinceEx = (performance.now() - state.lastRelease)/1000;
    if(sinceEx < P.exhale){
      $('noteLine').textContent = '呼气中 · 再数 ' + Math.max(1, Math.ceil(P.exhale - sinceEx)) + ' 秒';
    } else if(sinceEx < P.exhale + 1.4){
      $('noteLine').textContent = '好 · 吸一口，下一圈';
    } else {
      $('noteLine').textContent = '还剩 ' + Math.max(0, TARGET - state.rings.length) + ' 圈 · 随时可以停';
    }
  } else {
    $('noteLine').textContent = state.rings.length === 0 ? '按着石头别动，就是吸气' : '还剩 ' + Math.max(0, TARGET - state.rings.length) + ' 圈 · 随时可以停';
  }
}
function pressEnd(){
  if(!state.pressed) return;
  var held = performance.now() - state.pressStart;
  state.pressed = false;
  var rest = state.lastRelease ? Math.min(performance.now() - state.lastRelease, PATTERNS[store.prefs.pattern].exhale*1400) : 0;
  state.breathMs += held + rest;
  state.lastRelease = performance.now();
  var ok = false;
  if(state.input === 'trace'){
    if(state.trace.length > 10 && held > 700){
      ok = addRing(clamp(state.traceSpan/6.283, 0, 1) * (PATTERNS[store.prefs.pattern].inhale*1000), 'trace');
    } else {
      $('noteLine').textContent = '沿着石头的边，绕一整圈再松手';
    }
    state.trace = []; state.traceSpan = 0;
  } else {
    if(held >= MIN_HOLD) ok = addRing(held, 'hold');

  }

    buzz(18);

    $('hint').textContent = state.rings.length >= TARGET ? '坐好了 · 下面挑个天色' : '一圈落定 · 呼气的时候别急';
  }

}
function addRing(duration, kind){
  var P = PATTERNS[store.prefs.pattern];

  var amount = clamp((duration - MIN_HOLD) / Math.max(400, P.inhale*1000 - MIN_HOLD) * .82 + .18, .2, 1);
  state.rings.push({amount:amount, kind:kind, phase:(kind === 'hold' && state.draftPhase) ? state.draftPhase : seeded(state.seed + state.rings.length*97)()*6.283});

/* ===================== 描圈输入 ===================== */
function traceAdd(x, y){
  var cx = CX, cy = CY;
  var a = Math.atan2(y - cy, x - cx);
  var last = state.trace.length ? state.trace[state.trace.length-1].a : null;
  state.trace.push({x:x, y:y, a:a});
  if(state.trace.length > 240) state.trace.shift();
  if(last != null){
    var d = a - last;
    while(d > Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;
    state.traceSpan = Math.min(6.4, state.traceSpan + Math.abs(d));
  }
}

/* ===================== 石笺图像 ===================== */
function artwork(stone, width){
  var w = width || 1000, h = Math.round(w*1.25);
  var out = document.createElement('canvas');
  out.width = w; out.height = h;
  var c = out.getContext('2d');
  var L = LIGHTS[stone.light] || LIGHTS.dawn;
  var rand = seeded(stone.seed + 3);
  var s = w/1000;

  c.fillStyle = '#efece0'; c.fillRect(0,0,w,h);
  var hy = h*.42;
  var g = c.createLinearGradient(0,0,0,hy);
  g.addColorStop(0, L.sky[0]); g.addColorStop(1, L.sky[1]);
  c.fillStyle = g; c.fillRect(0,0,w,hy+1);

  /* 日/月：一小盘 */
  var lx = L.night ? w*.78 : w*.24, ly = h*.13;
  var hh = c.createRadialGradient(lx, ly, 0, lx, ly, w*.3);
  hh.addColorStop(0, L.halo); hh.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = hh; c.fillRect(0, 0, w, hy);
  c.fillStyle = L.disc;
  c.beginPath(); c.arc(lx, ly, w*.03, 0, Math.PI*2); c.fill();

  /* 远脊一线 + 树影一排 */
  (function(){
    var rr = seeded(stone.seed + 5);
    c.save(); c.strokeStyle = L.ink; c.globalAlpha = L.night ? .1 : .07; c.lineWidth = 1.2*s; c.lineCap = 'round';
    c.beginPath();
    for(var i=0;i<=90;i++){
      var x = i/90*w;
      var yy = (hy - h*.028) - Math.sin(i/90*Math.PI*2.4)*h*.014 - (rr()-.5)*h*.002;
      if(i) c.lineTo(x, yy); else c.moveTo(x, yy);
    }
    c.stroke(); c.restore(); c.globalAlpha = 1;
    var tr = seeded(stone.seed + 17);
    var tn = 8 + Math.floor(tr()*5);
    c.fillStyle = L.tree;
    for(var i2=0;i2<tn;i2++){
      var tx = w*.03 + tr()*w*.94, th = h*(.02 + tr()*.036), tw = 1.4*s + tr()*2.2*s;
      c.fillRect(tx, hy - th, tw, th);
      if(tr() > .45){ c.fillRect(tx - tw*2.6, hy - th*.62, tw*6, tw*.9); }
    }
  })();

  /* 雾带 */
  g = c.createLinearGradient(0, hy - h*.05, 0, hy + h*.01);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, L.fog);
  c.fillStyle = g; c.fillRect(0, hy - h*.05, w, h*.06);

  /* 苔地 */
  g = c.createLinearGradient(0, hy, 0, h*.74);
  g.addColorStop(0, L.moss[0]); g.addColorStop(.5, L.moss[1]); g.addColorStop(1, L.moss[2]);
  c.fillStyle = g; c.fillRect(0, hy, w, h*.32+1);
  var mcl = seeded(stone.seed + 23);
  for(var i3=0;i3<34;i3++){
    var t0f = Math.pow(mcl(), .62);
    var mx = mcl()*w, my = hy + t0f*(h*.74 - hy);
    var mr = w*(.012 + mcl()*.02)*(.7 + t0f*.9);
    c.globalAlpha = L.night ? .08 + mcl()*.08 : .12 + mcl()*.12;
    c.fillStyle = mcl() > .45 ? L.mossLite : L.mossDeep;
    c.beginPath(); c.ellipse(mx, my, mr*1.7, mr*.6, 0, 0, Math.PI*2); c.fill();
  }
  c.globalAlpha = 1;

  /* 石灯笼 */
  (function(){
    var side = (stone.seed % 2) ? 1 : -1;
    var sz2 = w*.05, bx = w/2 + side*w*.3, by = hy + (h*.74 - hy)*.5;
    c.save(); c.translate(bx, by);
    c.fillStyle = L.lantern; c.globalAlpha = L.night ? .9 : .6;
    c.fillRect(-sz2*.34, -sz2*.16, sz2*.68, sz2*.16);
    c.fillRect(-sz2*.2, -sz2*.78, sz2*.4, sz2*.62);
    c.fillRect(-sz2*.3, -sz2*1.16, sz2*.6, sz2*.38);
    c.beginPath();
    c.moveTo(-sz2*.46, -sz2*1.16); c.lineTo(sz2*.46, -sz2*1.16); c.lineTo(sz2*.26, -sz2*1.4); c.lineTo(-sz2*.26, -sz2*1.4);
    c.closePath(); c.fill();
    c.beginPath(); c.arc(0, -sz2*1.5, sz2*.08, 0, Math.PI*2); c.fill();
    c.globalAlpha = 1;
    c.fillStyle = L.night ? L.glow : 'rgba(40,48,38,.4)';
    c.fillRect(-sz2*.12, -sz2*1.08, sz2*.24, sz2*.22);
    if(L.night){
      var gg = c.createRadialGradient(0, -sz2*.97, 1, 0, -sz2*.97, sz2*1.5);
      gg.addColorStop(0, L.glow); gg.addColorStop(1, 'rgba(240,206,128,0)');
      c.fillStyle = gg; c.globalAlpha = .32;
      c.beginPath(); c.arc(0, -sz2*.97, sz2*1.5, 0, Math.PI*2); c.fill();
    }
    c.restore(); c.globalAlpha = 1;
  })();

  /* 石：与页面同一颗，由种子决定胖瘦与苔位 */
  var cx = w/2, cy = h*.47;
  var sp = seeded(stone.seed + 5);
  var szx = .9 + sp()*.2;
  var arx = w*.142*szx;
  var ary = arx*(.66 + sp()*.2);
  var tlt = (sp()-.5)*.08;
  var lmp = sp()*6.283;
  c.save(); c.translate(cx, cy); c.rotate(tlt);
  var sh = c.createRadialGradient(0, ary*1.22, 1, 0, ary*1.22, arx*1.7);
  sh.addColorStop(0, L.night ? 'rgba(4,8,5,.6)' : 'rgba(56,70,50,.32)');
  sh.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = sh;
  c.beginPath(); c.ellipse(0, ary*1.22, arx*1.7, ary*.4, 0, 0, Math.PI*2); c.fill();
  var sg = c.createLinearGradient(-arx*.4, -ary, arx*.4, ary);
  sg.addColorStop(0, L.stone[0]); sg.addColorStop(.58, L.stone[1]); sg.addColorStop(1, L.stone[2]);
  c.fillStyle = sg;
  pebble(c, 0, 0, arx, ary, lmp, .14);
  c.fill();
  c.save();
  pebble(c, 0, 0, arx, ary, lmp, .14);
  c.clip();
  var mc2 = 3 + Math.floor(sp()*4);
  for(var m2=0;m2<mc2;m2++){
    var ma2 = Math.PI*(.15 + sp()*.7);
    c.globalAlpha = L.night ? (.16 + sp()*.14) : (.2 + sp()*.18);
    c.fillStyle = L.moss[m2 % 3];
    c.beginPath();
    c.ellipse(-Math.cos(ma2)*arx*(.3 + sp()*.6), Math.sin(ma2)*ary*(.72 + sp()*.3), arx*(.12 + sp()*.16), ary*(.14 + sp()*.15), lmp + m2, 0, Math.PI*2);
    c.fill();
  }
  c.globalAlpha = 1;
  c.restore();
  c.save();
  c.beginPath(); c.rect(-arx*1.2, -ary*1.7, arx*2.4, ary*1.9); c.clip();
  c.strokeStyle = L.ink; c.globalAlpha = L.night ? .22 : .15; c.lineWidth = 1.1*s; c.lineCap = 'round';
  pebble(c, 0, 0, arx, ary, lmp, .14);
  c.stroke(); c.restore(); c.globalAlpha = 1;
  c.restore();

  /* 苔领：地面的苔漫上石脚 */
  var co2 = seeded(stone.seed + 13);
  for(var ci2=0;ci2<4;ci2++){
    var ca2 = Math.PI*(.15 + ci2*.23 + co2()*.08);
    c.globalAlpha = L.night ? (.48 + co2()*.18) : (.52 + co2()*.2);
    c.fillStyle = L.moss[2];
    c.beginPath();
    c.ellipse(cx + Math.cos(ca2)*arx*(.62 + co2()*.3), cy + Math.sin(ca2)*ary*1.02 + ary*.04, arx*(.1 + co2()*.1), ary*(.1 + co2()*.08), 0, 0, Math.PI*2);
    c.fill();
  }
  c.globalAlpha = 1;

  /* 两陪石：不对称三角呼应主石 */
  var cn = seeded(stone.seed + 77);
  var cbx = cx + w*.30, cby = cy + h*.02;
  var cdefs = [[.62, .09], [.38, .145]];
  for(var ci3=0;ci3<2;ci3++){
    var crx = w*.142*cdefs[ci3][0]*(1 + (cn()-.5)*.12);
    var cry = crx*(.58 + cn()*.18);
    var cpx = cbx + w*cdefs[ci3][1], cpy = cby + h*.012*(ci3 + .6);
    c.save(); c.translate(cpx, cpy); c.rotate((ci3 === 0 ? 1 : -1)*(.09 + cn()*.09));
    var cgd = c.createLinearGradient(-crx*.4, -cry, crx*.4, cry);
    cgd.addColorStop(0, L.stone[0]); cgd.addColorStop(.58, L.stone[1]); cgd.addColorStop(1, L.stone[2]);
    c.fillStyle = cgd;
    var cph = cn()*6.283;
    pebble(c, 0, 0, crx, cry, cph, .18);
    c.fill();
    c.globalAlpha = L.night ? .4 : .48;
    c.fillStyle = L.moss[2];
    c.beginPath(); c.ellipse(-crx*.3, cry*.86, crx*.5, cry*.2, 0, 0, Math.PI*2); c.fill();
    c.globalAlpha = 1;
    c.restore();
  }

  /* 圆相 */
  var det = (stone.detail && stone.detail.length) ? stone.detail : null;
  var u2 = Math.min(w*.9, h*.7);
  for(var r=0;r<stone.rings;r++){
    var one = det ? det[r] : null;
    var amt = one ? num(one.a, .8) : .8;
    var ph = one ? num(one.p, r*1.7) : r*1.7;
    var rad = u2*(.168 + r*.0305);
    inkArc(c, cx, cy, rad, ph - 2.5, ph + 3.55, .93, L.ink,
           (.55 + (.3 + amt*.7)*.95)*s*2.2, (L.night ? .2 : .17) + (.3 + amt*.7)*.4, ph*57 + r, 150);
  }

  /* 纸纤维与暗角 */
  c.globalAlpha = .035; c.fillStyle = L.ink;
  for(var d=0;d<340;d++){ c.save(); c.translate(rand()*w, rand()*h); c.fillRect(0,0,(2 + rand()*10)*s, .8*s); c.restore(); }
  c.globalAlpha = 1;
  var vg = c.createRadialGradient(w/2,h*.45,w*.34,w/2,h*.45,w*.86);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1, L.night?'rgba(9,14,20,.26)':'rgba(58,58,44,.07)');
  c.fillStyle = vg; c.fillRect(0,0,w,h);

  /* 题字 */
  var serif = getComputedStyle(document.body).getPropertyValue('--serif');
  var sans = getComputedStyle(document.body).getPropertyValue('--sans');
  var track = function(px){ try { c.letterSpacing = px + 'px'; } catch(e){} };
  c.textAlign = 'center';
  c.fillStyle = L.night ? '#eef1e6' : L.ink;
  track(14*s);
  c.font = (40*s) + 'px ' + serif;
  c.fillText(stone.name, w/2 - 7*s, h*.775);
  track(0);
  c.save(); c.globalAlpha = L.night ? .18 : .14; c.strokeStyle = L.ink; c.lineWidth = 1*s;
  c.beginPath(); c.moveTo(w*.42, h*.805); c.lineTo(w*.58, h*.805); c.stroke(); c.restore();
  track(6*s);
  c.globalAlpha = .68;
  c.font = (19*s) + 'px ' + sans;
  c.fillText(L.label + ' · ' + dayLabel(new Date(stone.date)), w/2 - 3*s, h*.845);
  c.globalAlpha = 1;
  if(stone.note){
    track(3*s);
    c.font = (25*s) + 'px ' + serif;
    c.globalAlpha = .8;
    c.fillText(String(stone.note).slice(0, 24), w/2 - 1.5*s, h*.895);
    c.globalAlpha = 1;
  }
  if(stone.mood){
    track(4*s);
    c.font = (18*s) + 'px ' + serif;
    c.globalAlpha = .55; c.fillText('心印 · ' + stone.mood, w/2 - 2*s, h*.932); c.globalAlpha = 1;
  }
  track(0);
  /* 印：小方块 + 一笔字 */
  var ss = w*.062, sx = w/2 + c.measureText(stone.name).width/2 + 30*s, sy = h*.775 - ss;
  c.save(); c.globalAlpha = .88; c.strokeStyle = '#a3452f'; c.fillStyle = '#a3452f'; c.lineWidth = 2.4*s;
  c.translate(sx + ss/2, sy + ss/2); c.rotate(-.05);
  c.beginPath(); c.rect(-ss/2, -ss/2, ss, ss); c.stroke();
  c.font = (ss*.62) + 'px ' + serif;
  c.fillText('息', 0, ss*.22);
  c.restore(); c.globalAlpha = 1;
  return out.toDataURL('image/png');
}
function currentStone(){
  var det = [];
  for(var i=0;i<state.rings.length;i++) det.push({a:+state.rings[i].amount.toFixed(3), p:+state.rings[i].phase.toFixed(3)});
  return {
    id:'s' + Date.now(), seed:state.seed, name:NAMES[state.seed % NAMES.length],
    date:new Date().toISOString(), light:state.light || store.prefs.light,
    mood:state.mood, note:state.note.trim(), rings:state.rings.length,
    detail:det, seconds:state.seconds, version:VER
  };
}

/* ===================== 声音 ===================== */
var actx = null;
function ensureAudio(){
  if(actx) return actx;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    actx = new AC();
  } catch(e){ actx = null; }
  return actx;
}
function chime(){
  if(!store.prefs.sound) return;
  var a = ensureAudio(); if(!a) return;
  try {
    if(a.state === 'suspended') a.resume();
    var t = a.currentTime;
    [[528, .09], [792, .045]].forEach(function(pair, i){
      var o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = pair[0];
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(pair[1], t + .04);
      g.gain.exponentialRampToValueAtTime(.0005, t + 2.4);
      o.connect(g); g.connect(a.destination);
      o.start(t + i*.05); o.stop(t + 2.6);
    });
  } catch(e){}
}
function setSound(on){
  store.prefs.sound = !!on; save();
  $('soundBtn').classList.toggle('on', on);
  $('soundBtn').setAttribute('aria-pressed', on ? 'true':'false');
  if(on){ ensureAudio(); chime(); toast('已打开：每坐完一圈会轻轻响一声'); }
  else toast('声音已关闭');
  if($('setSound')) { $('setSound').setAttribute('aria-pressed', on?'true':'false'); $('setSound').textContent = on ? '已开' : '已关'; }
}

/* ===================== 事件绑定 ===================== */
function bind(){
  /* 石头：按住 / 松开 */
  var hasPointer = 'onpointerdown' in window;
  function local(e){
    var r = canvas.getBoundingClientRect();
    var src = e.touches && e.touches.length ? e.touches[0] : (e.changedTouches && e.changedTouches.length ? e.changedTouches[0] : e);
    return {x:src.clientX - r.left, y:src.clientY - r.top};
  }
  if(hasPointer){
    hit.addEventListener('pointerdown', function(e){ e.preventDefault(); try{ hit.setPointerCapture(e.pointerId); }catch(x){} pressStart(); });
    hit.addEventListener('pointermove', function(e){
      if(!state.pressed || state.input !== 'trace') return;
      var p = local(e); traceAdd(p.x, p.y); updateLive();
    });
    hit.addEventListener('pointerup', function(e){ e.preventDefault(); pressEnd(); });
    hit.addEventListener('pointercancel', pressEnd);
    canvas.addEventListener('pointerdown', function(e){
      if(state.screen === 'done') return;
      var p = local(e);
      if(state.input === 'trace'){
        try{ canvas.setPointerCapture(e.pointerId); }catch(x){}
        pressStart(); return;
      }
      if(!state.pressed){
        if(lanternPos.r > 0 && Math.hypot(p.x - lanternPos.x, p.y - lanternPos.y) < lanternPos.r*1.2){
          amb.flash = performance.now(); buzz(8); return;
        }
        if(p.y > HY) puff(p.x, p.y);
      }
    });
    canvas.addEventListener('pointermove', function(e){
      var p = local(e);
      if(state.pressed && state.input === 'trace'){ traceAdd(p.x, p.y); updateLive(); return; }
      if(state.drag){
        state.offset.x = clamp(state.drag.ox + (e.clientX - state.drag.x), -16, 16);
        state.offset.y = clamp(state.drag.oy + (e.clientY - state.drag.y), -12, 12);
        bgKey = '';
      }
      if(state.screen === 'ritual' && Math.hypot(p.x - CX, p.y - CY) > U*.3) ripple(p.x, p.y);
    });
    canvas.addEventListener('pointerup', function(){ state.drag = null; if(state.pressed && state.input === 'trace') pressEnd(); });
    canvas.addEventListener('pointercancel', function(){ state.drag = null; });
  } else {
    /* 老浏览器 / 旧微信内核 */
    hit.addEventListener('touchstart', function(e){ e.preventDefault(); pressStart(); }, {passive:false});
    hit.addEventListener('touchmove', function(e){
      if(state.input !== 'trace') return;
      var p = local(e); traceAdd(p.x, p.y); updateLive();
    });
    hit.addEventListener('touchend', function(e){ e.preventDefault(); pressEnd(); });
    hit.addEventListener('mousedown', function(e){ e.preventDefault(); pressStart(); });
    document.addEventListener('mouseup', function(){ if(state.pressed) pressEnd(); });
  }
  hit.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  hit.addEventListener('dragstart', function(e){ e.preventDefault(); });

  /* 画布拖动换视角（鼠标） */
  canvas.addEventListener('mousedown', function(e){
    if(state.pressed) return;
    state.drag = {x:e.clientX, y:e.clientY, ox:state.offset.x, oy:state.offset.y};
  });
  document.addEventListener('mouseup', function(){ state.drag = null; });

  /* 键盘：空格/回车 = 一次呼吸 */
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      if($('coach').classList.contains('open')) return;
      if($('modal').classList.contains('open')){ closeModal(); return; }
      if($('sheet').classList.contains('open')){ $('sheet').classList.remove('open'); return; }
    }
    if(state.screen === 'done') return;
    if(e.code === 'Space' || e.key === ' ' || e.key === 'Enter'){
      if(document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;
      if(e.repeat) return;
      e.preventDefault();
      if(!state.pressed) pressStart(); else pressEnd();
    }
  });
  document.addEventListener('keyup', function(e){
    if(e.code === 'Space' || e.key === ' ' || e.key === 'Enter'){
      if(state.pressed){ e.preventDefault(); pressEnd(); }
    }
  });
  /* 离开页面时松开手，避免卡住 */
  window.addEventListener('blur', function(){ if(state.pressed) pressEnd(); });
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ running = false; if(state.pressed) pressEnd(); }
    else running = true;
  });

  /* 顶部工具 */
  $('soundBtn').addEventListener('click', function(){ setSound(!store.prefs.sound); });
  $('setBtn').addEventListener('click', function(){ openModal('settings'); });
  $('archiveBtn').addEventListener('click', function(){ renderEntries(); $('sheet').classList.add('open'); $('sheetX').focus(); });
  $('sheetX').addEventListener('click', function(){ $('sheet').classList.remove('open'); });
  $('sheet').addEventListener('click', function(e){ if(e.target === $('sheet')) $('sheet').classList.remove('open'); });
  $('entries').addEventListener('click', function(e){
    var v = e.target.closest ? e.target.closest('[data-view]') : null;
    var d = e.target.closest ? e.target.closest('[data-del]') : null;
    if(v){
      var x = null;
      for(var i=0;i<store.stones.length;i++) if(store.stones[i].id === v.getAttribute('data-view')) x = store.stones[i];
      if(!x) return;
      var pic = '';
      try { pic = artwork(x, 900); } catch(e){}
      openModal('view',
        '<div class="preview"><img src="' + pic + '" alt="' + esc(x.name) + ' 的石笺">'
        + '<p>' + esc((LIGHTS[x.light]||LIGHTS.dawn).label) + ' · ' + dayLabel(new Date(x.date)) + '<br>'
        + (x.mood ? '心印 ' + esc(x.mood) + ' · ' : '') + x.rings + ' 圈 · ' + mmss(x.seconds) + '</p>'
        + (x.note ? '<p>「' + esc(x.note) + '」</p>' : '')
        + '<div class="cta-row"><button class="big-btn ghost" id="vpSave" type="button">保存到相册（长按图）</button>'
        + '<button class="big-btn" id="vpDl" type="button">下载这张</button></div></div>');
      $('vpDl').addEventListener('click', function(){ download(pic, '呼吸石-' + x.name + '.png'); });
      $('vpSave').addEventListener('click', function(){ toast('长按上面的图，选「保存图片」'); });
      return;
    }
    if(d){
      var id = d.getAttribute('data-del');
      var target = null;
      for(var k=0;k<store.stones.length;k++) if(store.stones[k].id === id) target = store.stones[k];
      if(!target) return;
      confirmDialog('删掉这一张？', '「' + target.name + '」会从这台设备的收藏里去掉。', '删掉', function(){ deleteStone(id); });
    }
  });
  $('modalX').addEventListener('click', closeModal);
  $('modal').addEventListener('click', function(e){ if(e.target === $('modal')) closeModal(); });

  /* 节奏 chips */
  var chips = document.querySelectorAll('.chip');
  for(var i=0;i<chips.length;i++){
    chips[i].addEventListener('click', function(e){
      var b = e.currentTarget;
      store.prefs.pattern = b.getAttribute('data-pattern');
      save();
      for(var j=0;j<chips.length;j++) chips[j].setAttribute('aria-pressed', chips[j] === b ? 'true' : 'false');
      $('noteLine').textContent = PATTERNS[store.prefs.pattern].line;
      toast('节奏：' + PATTERNS[store.prefs.pattern].name + '，吸 ' + PATTERNS[store.prefs.pattern].inhale + ' 秒 / 呼 ' + PATTERNS[store.prefs.pattern].exhale + ' 秒');
    });
  }
  /* 天色 / 心印 */
  var lights = document.querySelectorAll('.light-btn');
  for(var l=0;l<lights.length;l++){
    lights[l].addEventListener('click', function(e){ setLight(e.currentTarget.getAttribute('data-light'), true); });
  }
  var moods = document.querySelectorAll('.mood-btn');
  for(var q=0;q<moods.length;q++){
    moods[q].addEventListener('click', function(e){
      var v = e.currentTarget.getAttribute('data-mood');
      setMood(state.mood === v ? '' : v);
    });
  }
  $('note').addEventListener('input', function(){
    state.note = $('note').value;
    $('noteCount').textContent = $('note').value.length;
  });
  $('startBtn').addEventListener('click', startRitual);
  $('picBtn').addEventListener('click', function(){ openModal('done'); });
  $('saveBtn').addEventListener('click', function(){ saveStone(); });
  $('quitBtn').addEventListener('click', function(){ resetRitual(); toast('今天就到这里 · 想坐随时回来'); });
  $('moreBtn').addEventListener('click', function(){
    if(state.rings.length >= TARGET + EXTRA){ toast('已经够多了 · 先收好吧'); return; }
    closeModal();
    state.extra = true;
    state.screen = 'ritual';
    setLine('再坐三圈，<b>慢慢来</b>', '最多坐到 ' + (TARGET+EXTRA) + ' 圈，然后收工。', '按石头吸气，松手呼气');
    renderAll(); updateLive();
  });

  /* 引导 */
  $('coachNext').addEventListener('click', function(){
    if(coachStep >= COACH.length-1){ closeCoach(); startRitual(); return; }
    coachStep++; renderCoach();
  });
  $('coachSkip').addEventListener('click', closeCoach);
  $('helpBtn').addEventListener('click', function(){
    coachStep = 0; renderCoach(); $('coach').classList.add('open');
  });
}
function download(dataUrl, name){
  try {
    var a = document.createElement('a');
    a.href = dataUrl; a.download = name;
    a.rel = 'noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('已尝试下载；微信里若没反应，请长按图片保存');
  } catch(e){ toast('这个浏览器不支持直接下载，请长按图片保存'); }
}

/* ===================== 启动 ===================== */
function boot(){
  load();
  state.input = store.prefs.input;
  document.documentElement.classList.toggle('elder', !!store.prefs.elder);
  var chips = document.querySelectorAll('.chip');
  for(var i=0;i<chips.length;i++){
    chips[i].setAttribute('aria-pressed', chips[i].getAttribute('data-pattern') === store.prefs.pattern ? 'true':'false');
  }
  state.light = store.prefs.light;
  setLight(store.prefs.lightChosen ? store.prefs.light : autoLight());
  renderAll();
  bind();
  resize();
  if(window.ResizeObserver){ try { new ResizeObserver(function(){ resize(); }).observe(scene); } catch(e){} }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 260); });
  raf = requestAnimationFrame(frame);
  if(!store.prefs.guided){ renderCoach(); } else { $('coach').classList.remove('open'); }
  setInterval(function(){
    if(state.screen === 'ritual' && !document.hidden) updateLive();
  }, 1000);
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
</body>
</html>
