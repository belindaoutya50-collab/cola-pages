<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7dfcf">
<title>呼吸石 | 正念小游戏</title>
<style>
:root{--paper:#e7dfcf;--paper-deep:#ddd3bf;--ink:#29453b;--ink-soft:#52685d;--line:rgba(41,69,59,.22);--vermilion:#a74835;--vermilion-deep:#83382d;--cream:#f5efe3;--shadow:rgba(38,48,40,.14);--sans:"Segoe UI","Microsoft YaHei",sans-serif;--serif:"Noto Serif CJK SC","Songti SC",serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{font-family:var(--sans);overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}.app{position:relative;min-height:100svh;isolation:isolate;overflow:hidden}.app:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.18;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.14'/%3E%3C/svg%3E")}.header{display:flex;align-items:center;justify-content:space-between;max-width:1180px;margin:0 auto;padding:24px 34px}.brand{display:flex;gap:12px;align-items:center;font-family:var(--serif);letter-spacing:.1em}.brand-mark{width:34px;height:34px;border:1px solid var(--ink);border-radius:47% 53% 45% 55%;display:grid;place-items:center;font-size:16px}.brand small{display:block;font:11px var(--sans);letter-spacing:.18em;color:var(--ink-soft);margin-top:3px}.top-actions{display:flex;gap:8px}.icon-btn,.text-btn{min-width:44px;min-height:44px;border:1px solid transparent;background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}.icon-btn:hover,.text-btn:hover{background:rgba(255,255,255,.22);border-color:var(--line)}.icon-btn:focus-visible,.text-btn:focus-visible,.primary:focus-visible,.stone:focus-visible,input:focus-visible{outline:3px solid rgba(167,72,53,.45);outline-offset:3px}.icon{width:19px;height:19px;display:block}.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:38px;max-width:1180px;margin:0 auto;padding:22px 34px 46px;min-height:calc(100svh - 90px)}.stage{position:relative;min-height:650px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--ink-soft);margin:0 0 18px}.prompt{font-family:var(--serif);font-size:clamp(24px,3.3vw,38px);font-weight:400;letter-spacing:.08em;margin:20px 0 7px}.hint{font-size:13px;color:var(--ink-soft);margin:0;letter-spacing:.08em}.canvas-wrap{position:relative;width:min(68vw,570px);height:min(68vw,570px);min-width:330px;min-height:330px}.canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.stone{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:52%;height:46%;border:0;background:transparent;color:var(--ink);z-index:2;border-radius:49% 51% 47% 53%;touch-action:none}.stone:active{cursor:grabbing}.press-label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--serif);font-size:17px;letter-spacing:.12em;pointer-events:none;opacity:.9}.hold-state{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);font-size:12px;color:var(--ink-soft);white-space:nowrap}.progress{width:min(320px,70vw);height:2px;background:rgba(41,69,59,.12);margin-top:24px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--ink);transition:width .6s ease}.side{border-left:1px solid var(--line);padding:20px 0 0 26px;align-self:center}.side h2{font-family:var(--serif);font-weight:400;font-size:18px;margin:0 0 18px;letter-spacing:.08em}.side p{font-size:12px;color:var(--ink-soft);line-height:1.8;margin:0 0 22px}.ring-list{display:flex;flex-direction:column;gap:12px}.ring-item{display:flex;align-items:center;gap:12px;color:var(--ink-soft);font-size:12px}.ring-dot{width:22px;height:22px;border:1px solid var(--line);border-radius:50%;position:relative}.ring-dot:after{content:"";position:absolute;inset:4px;border-radius:50%;background:transparent}.ring-item.done{color:var(--ink)}.ring-item.done .ring-dot{border-color:var(--ink)}.ring-item.done .ring-dot:after{background:var(--ink)}.completion{display:none;width:min(100%,460px);animation:appear .8s ease both}.completion.show{display:block}.seal{width:68px;height:68px;margin:0 auto 18px;border:2px solid var(--vermilion);color:var(--vermilion);display:grid;place-items:center;font-family:var(--serif);font-size:19px;line-height:1.05;writing-mode:vertical-rl;transform:rotate(-4deg)}.completion h1{font:400 27px var(--serif);letter-spacing:.1em;margin:0 0 9px}.date{color:var(--ink-soft);font-size:12px;letter-spacing:.15em}.line{font:17px var(--serif);margin:25px 0;letter-spacing:.08em}.note-label{display:block;text-align:left;font-size:11px;letter-spacing:.12em;color:var(--ink-soft);margin-bottom:7px}.note{display:block;width:100%;height:46px;resize:none;border:1px solid var(--line);background:rgba(255,255,255,.17);color:var(--ink);padding:12px;font-size:13px;border-radius:0}.primary{margin-top:14px;min-height:45px;border:1px solid var(--ink);background:var(--ink);color:var(--cream);padding:0 18px;letter-spacing:.08em}.primary:hover{background:#1e392f}.completion-actions{display:flex;gap:10px;justify-content:center;margin-top:18px}.completion-actions button{min-height:44px;border:0;background:transparent;color:var(--ink);font-size:12px;padding:0 10px;text-decoration:underline;text-underline-offset:4px}.drawer{position:fixed;inset:0;z-index:10;background:rgba(31,48,39,.24);display:none;align-items:stretch;justify-content:flex-end}.drawer.open{display:flex}.drawer-panel{width:min(390px,100%);background:var(--cream);padding:28px 26px;box-shadow:-12px 0 30px var(--shadow);overflow-y:auto}.drawer-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.drawer-head h2{font:400 21px var(--serif);margin:0;letter-spacing:.08em}.collection-empty{color:var(--ink-soft);font-size:13px;line-height:1.8;margin-top:35px}.entry{border-bottom:1px solid var(--line);padding:19px 0}.entry-top{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft)}.entry-line{font:16px var(--serif);margin:12px 0 6px}.entry-note{font-size:12px;color:var(--ink-soft);margin:0;line-height:1.6}.intro{position:fixed;inset:0;z-index:20;background:rgba(231,223,207,.97);display:grid;place-items:center;padding:30px}.intro.hidden{display:none}.intro-inner{width:min(470px,100%);text-align:center}.intro-kana{font-size:11px;letter-spacing:.28em;color:var(--ink-soft);margin-bottom:24px}.intro h1{font:400 clamp(42px,9vw,72px) var(--serif);letter-spacing:.18em;margin:0 0 18px}.intro p{font:15px var(--serif);line-height:2.2;letter-spacing:.08em;margin:0 auto 32px;color:var(--ink-soft)}.intro .primary{padding:0 30px}.sound-note{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--ink-soft);opacity:.8}.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--cream);font-size:12px;padding:11px 16px;opacity:0;pointer-events:none;transition:.3s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:800px){.header{padding:18px 20px}.main{display:block;padding:4px 20px 34px}.stage{min-height:calc(100svh - 83px);justify-content:center}.canvas-wrap{width:min(94vw,520px);height:min(94vw,520px);min-width:280px;min-height:280px}.prompt{font-size:25px;margin-top:10px}.side{display:none}.sound-note{bottom:12px}.drawer-panel{padding:24px 20px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="header"><div class="brand"><div class="brand-mark" aria-hidden="true">呼</div><div>呼吸石<small>MINDFULNESS STONE</small></div></div><div class="top-actions"><button class="icon-btn" id="soundBtn" type="button" aria-label="开启环境声音" aria-pressed="false" title="环境声音"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10v4h4l5 4V6l-5 4H3Z"/><path d="M16 9.5a4 4 0 0 1 0 5M18.5 7a7.5 7.5 0 0 1 0 10"/></svg></button><button class="icon-btn" id="drawerBtn" type="button" aria-label="打开我的收藏" title="我的收藏"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4h12v16l-6-3-6 3V4Z"/></svg></button></div></header>
<main class="main"><section class="stage" aria-label="呼吸石互动区域"><div id="practice"><p class="eyebrow">今日一石</p><div class="canvas-wrap" id="canvasWrap"><canvas id="canvas" aria-label="呼吸石与树轮动画"></canvas><button class="stone" id="stone" type="button" aria-label="按住呼吸石，随呼吸生长树轮"><span class="press-label">按住</span></button><div class="hold-state" id="holdState" aria-live="polite">让呼吸慢下来</div></div><p class="prompt">吸气，石头向外生长</p><p class="hint">呼气时松开手指</p><div class="progress" aria-label="树轮进度"><i id="progress"></i></div></div><section class="completion" id="completion" aria-live="polite"><div class="seal" aria-label="完成印章">已成</div><h1>这一刻，已被留住</h1><div class="date" id="completionDate"></div><p class="line">石上无言，心自有回声。</p><label class="note-label" for="note">此刻的心情（可选）</label><textarea class="note" id="note" maxlength="80" placeholder="写下一句话，或留白。" aria-describedby="noteCount"></textarea><div id="noteCount" class="hint" style="text-align:right;margin-top:5px">0 / 80</div><button class="primary" id="saveBtn" type="button">收进我的石集</button><div class="completion-actions"><button id="exportBtn" type="button">导出一张石笺</button><button id="newBtn" type="button">再坐一会儿</button></div></section></section><aside class="side"><h2>一圈，又一圈</h2><p>按住石头，跟随它的呼吸。每一次停留，都会在石面留下一个不完全相同的年轮。</p><div class="ring-list" id="ringList"><div class="ring-item"><span class="ring-dot"></span><span>让身体找到节奏</span></div><div class="ring-item"><span class="ring-dot"></span><span>让念头经过</span></div><div class="ring-item"><span class="ring-dot"></span><span>让此刻留下来</span></div></div></aside></main>
<div class="sound-note">声音只在你愿意时发生 · 所有记录仅存于此设备</div>
</div>
<div class="intro" id="intro"><div class="intro-inner"><div class="intro-kana">A SMALL PAUSE FOR TODAY</div><h1>呼吸石</h1><p>不必完成什么。<br>只需按住一块石头，<br>让三次呼吸在纸上留下痕迹。</p><button class="primary" id="beginBtn" type="button">坐下来</button></div></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><div class="drawer-panel"><div class="drawer-head"><h2 id="drawerTitle">我的石集</h2><button class="icon-btn" id="closeDrawerBtn" type="button" aria-label="关闭收藏"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="entries"></div></div></div><div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const $=id=>document.getElementById(id), canvas=$('canvas'), ctx=canvas.getContext('2d'), wrap=$('canvasWrap');
  let dpr=1, w=0, h=0, raf=0, pressed=false, pressStart=0, lastRing=0, rings=0, ripple=[], motes=[], audio=null, saved=JSON.parse(localStorage.getItem('breathing-stones')||'[]');
  const ink='#29453b', verm='#a74835';
  function resize(){const r=wrap.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!motes.length)for(let i=0;i<26;i++)motes.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.3,a:Math.random()*.35+.08,s:Math.random()*.18+.04});}
  function organic(cx,cy,rx,ry,phase,alpha=1){ctx.beginPath();for(let i=0;i<=72;i++){const a=i/72*Math.PI*2;const wob=1+Math.sin(a*3+phase)*.025+Math.sin(a*7-phase)*.014;const x=cx+Math.cos(a)*rx*wob,y=cy+Math.sin(a)*ry*wob;if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)}ctx.closePath();ctx.strokeStyle=`rgba(41,69,59,${alpha})`;ctx.lineWidth=1.1;ctx.stroke()}
  function draw(t){ctx.clearRect(0,0,w,h);const cx=w/2,cy=h/2, breath=pressed?Math.min(1,(t-pressStart)/5000):0;motes: for(const m of motes){m.y-=m.s;if(m.y<-5)m.y=h+5;ctx.fillStyle=`rgba(41,69,59,${m.a})`;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,7);ctx.fill()}const pulse=Math.sin(t/1700)*.018+(pressed?breath*.028:0);organic(cx,cy,w*.23*(1+pulse),h*.18*(1+pulse*.6),t/2200,.42);ctx.save();ctx.translate(cx,cy);ctx.rotate(-.04);ctx.fillStyle='rgba(98,111,91,.16)';ctx.strokeStyle='rgba(41,69,59,.68)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-w*.22,-h*.03);ctx.bezierCurveTo(-w*.18,-h*.18,w*.1,-h*.23,w*.22,-h*.05);ctx.bezierCurveTo(w*.19,h*.14,w*.03,h*.2,-w*.17,h*.13);ctx.bezierCurveTo(-w*.23,h*.09,-w*.24,h*.03,-w*.22,-h*.03);ctx.fill();ctx.stroke();ctx.restore();for(let i=0;i<rings;i++){const rad=w*(.115+i*.038);organic(cx,cy,rad,rad*.76,i*1.7,.23+.07*i)}for(const p of ripple){p.r+=.8;p.a-=.012;organic(p.x,p.y,p.r,p.r*.7,p.r,.22*Math.max(0,p.a))}ripple=ripple.filter(p=>p.a>0);raf=requestAnimationFrame(draw)}
  function setRings(n){rings=n;$('progress').style.width=Math.min(100,n/3*100)+'%';document.querySelectorAll('.ring-item').forEach((el,i)=>el.classList.toggle('done',i<n));}
  function finish(){if(rings<3)return; $('practice').style.display='none';$('completion').classList.add('show');$('completionDate').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric'}).format(new Date());$('note').focus();}
  function release(){if(!pressed)return;pressed=false;$('stone').classList.remove('active');$('holdState').textContent='一圈留下了';const now=performance.now();if(now-pressStart>700&&now-lastRing>500){lastRing=now;setRings(Math.min(3,rings+1));ripple.push({x:w/2+(Math.random()-.5)*8,y:h/2+(Math.random()-.5)*8,r:w*.14,a:1});if(rings===3)setTimeout(finish,850)}}
  $('stone').addEventListener('pointerdown',e=>{e.preventDefault();if(rings>=3)return;pressed=true;pressStart=performance.now();$('stone').setPointerCapture(e.pointerId);$('holdState').textContent='跟着石头，慢慢吸气';});$('stone').addEventListener('pointerup',release);$('stone').addEventListener('pointercancel',release);$('stone').addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!pressed){e.preventDefault();pressed=true;pressStart=performance.now();$('holdState').textContent='跟着石头，慢慢吸气'}});$('stone').addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();release()}});
  $('beginBtn').onclick=()=>{$('intro').classList.add('hidden');$('stone').focus()};$('newBtn').onclick=()=>{rings=0;setRings(0);$('completion').classList.remove('show');$('practice').style.display='block';$('note').value='';$('holdState').textContent='让呼吸慢下来';$('stone').focus()};$('note').oninput=()=>{$('noteCount').textContent=$('note').value.length+' / 80'};
  function renderEntries(){const el=$('entries');if(!saved.length){el.innerHTML='<p class="collection-empty">还没有收藏的石头。<br>完成一次呼吸，它会在这里安静地等你。</p>';return}el.innerHTML=saved.slice().reverse().map(x=>`<article class="entry"><div class="entry-top"><span>${x.date}</span><span>${x.rings} 圈</span></div><p class="entry-line">石上无言，心自有回声。</p>${x.note?`<p class="entry-note">${x.note.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</p>`:''}</article>`).join('')}
  $('saveBtn').onclick=()=>{saved.push({date:$('completionDate').textContent,note:$('note').value.trim(),rings:3});localStorage.setItem('breathing-stones',JSON.stringify(saved));renderEntries();$('toast').textContent='已收进石集';$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)};
  $('drawerBtn').onclick=()=>{$('drawer').classList.add('open');renderEntries();$('closeDrawerBtn').focus()};$('closeDrawerBtn').onclick=()=>{$('drawer').classList.remove('open');$('drawerBtn').focus()};$('drawer').addEventListener('click',e=>{if(e.target===$('drawer'))$('closeDrawerBtn').click()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('drawer').classList.contains('open'))$('closeDrawerBtn').click()});
  $('exportBtn').onclick=()=>{const out=document.createElement('canvas');out.width=1200;out.height=900;const c=out.getContext('2d');c.fillStyle='#e7dfcf';c.fillRect(0,0,1200,900);c.fillStyle=ink;c.textAlign='center';c.font='46px serif';c.fillText('呼吸石',600,170);c.font='22px serif';c.fillText('石上无言，心自有回声。',600,650);c.font='16px sans-serif';c.fillStyle='#52685d';c.fillText($('completionDate').textContent,600,700);c.strokeStyle=ink;c.lineWidth=2;c.beginPath();c.ellipse(600,430,210,160,0,0,7);c.stroke();for(let i=1;i<4;i++){c.beginPath();c.ellipse(600,430,210-i*32,160-i*25,0,0,7);c.stroke()}const a=document.createElement('a');a.download='呼吸石-'+new Date().toISOString().slice(0,10)+'.png';a.href=out.toDataURL('image/png');a.click()};
  $('soundBtn').onclick=()=>{if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=174;g.gain.value=.018;o.connect(g).connect(audio.destination);o.start();$('soundBtn').setAttribute('aria-pressed','true');$('soundBtn').setAttribute('aria-label','关闭环境声音');}else if(audio.state==='running'){audio.suspend();$('soundBtn').setAttribute('aria-pressed','false');$('soundBtn').setAttribute('aria-label','开启环境声音')}else{audio.resume();$('soundBtn').setAttribute('aria-pressed','true');$('soundBtn').setAttribute('aria-label','关闭环境声音')}};
  new ResizeObserver(resize).observe(wrap);resize();renderEntries();requestAnimationFrame(draw);
})();
</script></body></html>
